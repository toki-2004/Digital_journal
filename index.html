  if (sel && sel.createdBy) {
    cr.textContent = '创建：' + sel.createdBy.name + ' · ' + formatElementTime(sel.createdAt);
    cr.classList.remove('hidden');
  } else if (sel) {
    cr.textContent = '创建：旧数据（未知）';
    cr.classList.remove('hidden');
  } else {
    cr.classList.add('hidden');
  }
  const lock = locks.get(selectedId);
  const note = $('#inspLockNote');
  if (lock && lock.userId !== me.id) {
    note.textContent = '🔒 ' + lock.userName + ' 正在编辑';
    note.classList.remove('hidden');
  } else {
    note.classList.add('hidden');
  }
}

function deleteSelected() {
  if (!selectedId || !canEdit) return;
  const id = selectedId;
  removeElementLocal(id);
  sendOp({ type: 'delete-elements', ids: [id] });
}

function duplicateElement(el, dx = 26, dy = 26) {
  const clone = JSON.parse(JSON.stringify(el));
  clone.id = uid();
  delete clone.createdBy; // 复制品由复制者重新署名
  delete clone.createdAt;
  stampElement(clone);
  if (clone.kind === 'image') { clone.x += dx; clone.y += dy; }
  else if (clone.kind === 'circle') { clone.cx += dx; clone.cy += dy; }
  else if (clone.kind === 'text') { clone.x += dx; clone.y += dy; }
  else if (clone.kind === 'pen') clone.points = clone.points.map((pt) => ({ x: pt.x + dx, y: pt.y + dy }));
  else { clone.x1 += dx; clone.y1 += dy; clone.x2 += dx; clone.y2 += dy; }
  return clone;
}

/** 元素创建信息（创建人 / 创建时间） */
function stampElement(el) {
  if (!el) return el;
  if (!el.createdBy) el.createdBy = { id: me.id, name: me.name };
  if (el.createdAt == null) el.createdAt = Date.now();
  return el;
}

/** 以元素自身中心为基准等比缩放（图片与标注通用，中心保持不变） */
function scaleElement(el, factor) {
  if (!el) return;
  if (el.kind === 'image') {
    el.width = Math.max(24, el.width * factor);
    el.height = Math.max(24, el.height * factor);
    return;
  }
  const c = elementCenter(el);
  const around = (x, y) => ({ x: c.x + (x - c.x) * factor, y: c.y + (y - c.y) * factor });
  switch (el.kind) {
    case 'pen':
      el.points = el.points.map((pt) => around(pt.x, pt.y));
      break;
    case 'line':
    case 'arrow':
    case 'rect': {
      const p1 = around(el.x1, el.y1);
      const p2 = around(el.x2, el.y2);
      el.x1 = p1.x; el.y1 = p1.y; el.x2 = p2.x; el.y2 = p2.y;
      break;
    }
    case 'circle':
      el.r = Math.max(2, el.r * factor);
      break;
    case 'text': {
      el.fontSize = Math.max(8, (el.fontSize || 26) * factor);
      const m = textMetrics(el);
      el.x = c.x - m.w / 2;
      el.y = c.y - m.h / 2;
      break;
    }
  }
}

/** 精确旋转选中图片（15° 步进） */
function rotateSelected(deg) {
  const el = selectedId && findElement(selectedId);
  if (!el || !canEdit) return;
  el.rotation = (el.rotation || 0) + deg * Math.PI / 180;
  if (el.kind === 'image') {
    sendOp({ type: 'transform-image', id: el.id, x: el.x, y: el.y, rotation: el.rotation, width: el.width, height: el.height });
  } else {
    sendOp({ type: 'update-annotation', element: JSON.parse(JSON.stringify(el)) });
  }
}

// ---------- 元素信息（右键查看创建人与创建时间） ----------
function elementTypeName(el) {
  if (!el) return '元素';
  const names = { image: '图片', pen: '笔迹', line: '直线', rect: '矩形', circle: '圆形', arrow: '箭头', text: '文字' };
  return names[el.kind] || '元素';
}

function formatElementTime(t) {
  if (t == null) return '旧数据（未知）';
  const d = new Date(t);
  if (isNaN(d.getTime())) return '旧数据（未知）';
  const pad = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
    + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function showElementMenu(clientX, clientY, el) {
  const menu = $('#elementMenu');
  $('#emTitle').textContent = elementTypeName(el);
  $('#emCreator').textContent = (el.createdBy && el.createdBy.name) || '旧数据（未知）';
  $('#emTime').textContent = formatElementTime(el.createdAt);
  menu.classList.remove('hidden');
  const areaRect = $('.canvas-area').getBoundingClientRect();
  const mw = menu.offsetWidth || 200;
  const mh = menu.offsetHeight || 110;
  menu.style.left = clamp(clientX - areaRect.left, 4, Math.max(4, areaRect.width - mw - 4)) + 'px';
  menu.style.top = clamp(clientY - areaRect.top, 4, Math.max(4, areaRect.height - mh - 4)) + 'px';
}

function hideElementMenu() {
  $('#elementMenu').classList.add('hidden');
}

function duplicateSelected() {
  const el = selectedId && findElement(selectedId);
  if (!el || !canEdit) return;
  const clone = duplicateElement(el);
  if (clone.layer === 'image') { roomData.images.push(clone); ensureImage(clone); }
  else roomData.annotations.push(clone);
  selectedId = clone.id;
  sendOp({ type: 'duplicate', elements: [clone] });
  updateInspector();
}

function reorderSelected(mode) {
  const el = selectedId && findElement(selectedId);
  if (!el || !canEdit) return;
  // 全局层级：图片与标注统一排序，图片也可以浮到笔迹之上
  setElementZ(el, mode);
  sendOp({ type: 'reorder', ids: [el.id], mode });
}

function setElementZ(el, mode) {
  if (!activePage) return;
  const images = activePage.images;
  const annotations = activePage.annotations;
  let min = Infinity, max = -Infinity;
  for (const e of images.concat(annotations)) {
    const z = elementZ(e, images, annotations);
    min = Math.min(min, z);
    max = Math.max(max, z);
  }
  el.z = mode === 'back' ? min - 1 : max + 1;
}

// ---------- 图片上传 ----------
async function addImageFromFile(file) {
  if (!canEdit) { toast('只读模式，无法上传图片', 'error'); return; }
  try {
    const dataUrl = await compressImage(file, 1600, 0.85);
    const img = new Image();
    img.onload = () => {
      const maxW = LOGICAL_W * 0.6, maxH = LOGICAL_H * 0.6;
      const s = Math.min(1, maxW / img.width, maxH / img.height);
      const el = {
        id: uid(), kind: 'image', layer: 'image', src: dataUrl,
        x: LOGICAL_W / 2, y: LOGICAL_H / 2,
        width: img.width * s, height: img.height * s, rotation: 0,
      };
      stampElement(el);
      imgCache.set(el.id, img);
      roomData.images.push(el);
      selectedId = el.id;
      sendOp({ type: 'add-image', element: el }, { onFail: () => removeElementLocal(el.id) });
      updateInspector();
      toast('图片已添加', 'ok');
    };
    img.onerror = () => toast('图片加载失败', 'error');
    img.src = dataUrl;
  } catch (err) {
    toast(err.message, 'error');
  }
}

// ---------- 房间打开 / 关闭 ----------
function applyServerData(data) {
  // 合并式更新：保留会话中已加载的页面内容，其余页面保持未加载（按需拉取）
  const oldPages = roomData ? roomData.pages : null;
  const pages = normalizePages(data).map((meta) => {
    const old = oldPages ? oldPages.find((p) => p.id === meta.id) : null;
    const src = (old && old.loaded) ? old : (meta.loaded === true ? meta : null);
    return {
      id: meta.id,
      name: meta.name || '第 1 页',
      images: src ? (src.images || []) : [],
      annotations: src ? (src.annotations || []) : [],
      loaded: !!src,
    };
  });
  roomData = {
    id: data.id,
    name: data.name,
    editPermission: data.editPermission,
    createdBy: data.createdBy,
    createdAt: data.createdAt,
    lastModified: data.lastModified,
    revision: data.revision || 0,
    pages,
    history: data.history || [],
  };
  const want = data.activePageId || pages[0].id;
  activePage = pages.find((p) => p.id === want) || pages[0];
  activePageId = activePage.id;
  // 让旧代码中的 roomData.images / roomData.annotations 始终指向当前页
  Object.defineProperty(roomData, 'images', {
    get() { return activePage ? activePage.images : []; },
    set(v) { if (activePage) activePage.images = v; },
    enumerable: true,
    configurable: true,
  });
  Object.defineProperty(roomData, 'annotations', {
    get() { return activePage ? activePage.annotations : []; },
    set(v) { if (activePage) activePage.annotations = v; },
    enumerable: true,
    configurable: true,
  });
  locks = new Map(Object.entries(data.locks || {}));
  for (const page of roomData.pages) {
    for (const im of page.images) ensureImage(im);
  }
  $('#roomName').textContent = roomData.name;
  updatePermUI();
  renderTimeline();
  renderMembers();
  updateInspector();
  renderPageBar();
  resetZoom();
}

/** 兼容旧版单页数据（顶层 images/annotations） */
function normalizePages(data) {
  if (Array.isArray(data.pages) && data.pages.length) {
    return data.pages.map((p) => ({
      id: p.id,
      name: p.name || '第 1 页',
      loaded: p.loaded === true || (Array.isArray(p.images) && p.images.length) || (Array.isArray(p.annotations) && p.annotations.length),
      images: (Array.isArray(p.images) && (p.loaded === true || p.images.length)) ? p.images : [],
      annotations: (Array.isArray(p.annotations) && (p.loaded === true || p.annotations.length)) ? p.annotations : [],
    }));
  }
  return [{
    id: 'page_1',
    name: '第 1 页',
    loaded: true,
    images: data.images || [],
    annotations: data.annotations || [],
  }];
}

let pageLoading = false;

function showLoading(show) {
  $('#pageLoading').classList.toggle('hidden', !show);
}

/** 按需加载一个页面的完整内容（服务器优先，失败回退 IndexedDB） */
async function loadPageContent(pageId) {
  const page = pageById(pageId);
  if (!page || page.loaded) return true;
  try {
    const data = await fetchJSON('/api/rooms/' + currentRoomId + '/page/' + pageId, {}, 30000);
    page.images = data.images || [];
    page.annotations = data.annotations || [];
    for (const im of page.images) ensureImage(im);
    page.loaded = true;
    idbPut(snapshotForIDB());
    return true;
  } catch (e) {
    // 服务器不可用时回退本地缓存
    const cached = await idbGet(currentRoomId);
    if (cached && cached.pages) {
      const cp = cached.pages.find((p) => p.id === pageId);
      if (cp && (cp.loaded === true || (cp.images && cp.images.length) || (cp.annotations && cp.annotations.length))) {
        page.images = cp.images || [];
        page.annotations = cp.annotations || [];
        for (const im of page.images) ensureImage(im);
        page.loaded = true;
        return true;
      }
    }
    return false;
  }
}

/** 加载当前激活页面（进入房间时调用） */
async function loadActivePage() {
  if (!activePage || activePage.loaded) return;
  pageLoading = true;
  showLoading(true);
  const ok = await loadPageContent(activePage.id);
  pageLoading = false;
  showLoading(false);
  if (!ok) toast('无法加载「' + activePage.name + '」的内容，请检查服务器', 'error');
}

function updatePermUI() {
  isAdmin = !!(roomData && roomData.createdBy === me.id);
  canEdit = !!(roomData && (roomData.editPermission === 'editable' || isAdmin));
  const badge = $('#permBadge');
  badge.textContent = roomData && roomData.editPermission === 'readonly' ? '只读' : '可编辑';
  badge.classList.toggle('ro', !!(roomData && roomData.editPermission === 'readonly'));
  $('#readonlyBanner').classList.toggle('hidden', canEdit);
  for (const b of document.querySelectorAll('#toolbar .tool-btn')) {
    b.disabled = !canEdit && b.dataset.tool !== 'select';
  }
  $('#btnUploadImage').disabled = !canEdit;
  $('#btnAddPage').disabled = !canEdit;
}

async function openRoom(roomId, password) {
  joinPassword = password || '';
  currentRoomId = roomId;
  selectedId = null;
  hoveredId = null;
  currentAction = null;
  copyBuffer = null;
  locks = new Map();
  members = [];
  memberCursors.clear();
  roomData = null;
  activePage = null;
  activePageId = null;
  renderTimeline();
  renderMembers();
  updateInspector();
  $('#homeView').classList.add('hidden');
  $('#editorView').classList.remove('hidden');
  resizeCanvas(); // 编辑器此刻才可见，必须用真实尺寸重新布局画布
  setConn('connecting');

  let data = null;
  try {
    data = await fetchJSON('/api/rooms/' + roomId + '/data', {}, 8000);
  } catch (e) {
    data = await idbGet(roomId);
    if (data) toast('服务器数据暂时不可用，已从本地缓存恢复', 'error');
  }
  if (!data) { toast('无法加载房间数据', 'error'); goHome(); return; }
  applyServerData(data);
  idbPut(snapshotForIDB());

  if (!socket.connected) {
    toast('无法连接实时服务器，请检查 node server.js 是否在运行', 'error');
    goHome();
    return;
  }
  socket.emit('join-room', { roomId, password: joinPassword, user: me }, (res) => {
    if (!res || !res.ok) {
      toast((res && res.reason) || '加入房间失败', 'error');
      goHome();
      return;
    }
    applyServerData(res.data);
    idbPut(snapshotForIDB());
    setConn('on');
    toast('已进入「' + roomData.name + '」', 'ok');
    loadActivePage(); // 只加载当前显示的这一页，避免一次性拉全量大图
    socket.emit('update-page', { pageId: activePage.id });
  });
}

function goHome() {
  if (currentRoomId) socket.emit('leave-room');
  pageLoading = false;
  showLoading(false);
  hideElementMenu();
  currentRoomId = null;
  roomData = null;
  activePage = null;
  activePageId = null;
  selectedId = null;
  currentAction = null;
  locks = new Map();
  members = [];
  memberCursors.clear();
  $('#editorView').classList.add('hidden');
  $('#homeView').classList.remove('hidden');
  renderPageBar();
  loadRooms();
}

// ---------- 多页管理 ----------
function pageNumberName(n) {
  return '第 ' + n + ' 页';
}

function nextPageNumber() {
  let max = 0;
  for (const p of roomData.pages) {
    const m = /第\s*(\d+)\s*页/.exec(p.name);
    if (m) max = Math.max(max, Number(m[1]));
  }
  return max + 1;
}

function pageById(id) {
  if (!roomData || !roomData.pages) return null;
  return roomData.pages.find((p) => p.id === id) || roomData.pages[0] || null;
}

function renderPageBar() {
  const tabs = $('#pageTabs');
  if (!roomData || !roomData.pages || !roomData.pages.length) {
    tabs.innerHTML = '';
    return;
  }
  tabs.innerHTML = roomData.pages.map((p) =>
    '<div class="page-tab' + (p.id === activePageId ? ' active' : '') + '" data-id="' + esc(p.id) + '" title="点击切换 · 双击重命名">'
    + '<span class="pt-name">' + esc(p.name) + '</span>'
    + (roomData.pages.length > 1 ? '<span class="pt-del" title="删除页面">×</span>' : '')
    + '</div>'
  ).join('');
  for (const tab of tabs.querySelectorAll('.page-tab')) {
    tab.addEventListener('click', (e) => {
      if (e.target.classList.contains('pt-del')) return;
      switchPage(tab.dataset.id);
    });
    tab.addEventListener('dblclick', () => renamePage(tab.dataset.id));
    const del = tab.querySelector('.pt-del');
    if (del) del.addEventListener('click', (e) => {
      e.stopPropagation();
      deletePage(tab.dataset.id);
    });
  }
}

function switchPage(id, silent) {
  const p = roomData && roomData.pages.find((x) => x.id === id);
  if (!p) return;
  activePage = p;
  activePageId = p.id;
  selectedId = null;
  hoveredId = null;
  if (currentAction) cancelCurrentAction();
  updateInspector();
  renderPageBar();
  renderMembers();
  hideElementMenu();
  socket.emit('update-page', { pageId: p.id });
  if (!silent) toast('已切换到「' + p.name + '」');
  if (!p.loaded) {
    // 未加载的页面按需拉取内容
    pageLoading = true;
    showLoading(true);
    loadPageContent(p.id).then((ok) => {
      pageLoading = false;
      showLoading(false);
      if (!ok) toast('无法加载「' + p.name + '」的内容，请检查服务器', 'error');
    });
  }
}

function addPage() {
  if (!canEdit) { toast('只读模式，无法新增页面', 'error'); return; }
  const page = {
    id: uid().replace(/^e_/, 'p_'),
    name: pageNumberName(nextPageNumber()),
    images: [],
    annotations: [],
  };
  roomData.pages.push(page);
  activePage = page;
  activePageId = page.id;
  selectedId = null;
  updateInspector();
  renderPageBar();
  sendOp({ type: 'add-page', page: JSON.parse(JSON.stringify(page)) });
  toast('已新增「' + page.name + '」', 'ok');
}

function renamePage(id) {
  if (!canEdit) return;
  const p = roomData.pages.find((x) => x.id === id);
  if (!p) return;
  const modal = openModal({
    title: '重命名页面',
    body: '<div class="field"><label class="f-label">页面名称</label><input type="text" id="pageNameInput" maxlength="30" value="' + esc(p.name) + '"></div>',
    buttons: [{ label: '取消', value: false }, { label: '保存', value: true, primary: true }],
  });
  setTimeout(() => { const el = $('#pageNameInput'); if (el) { el.focus(); el.select(); } }, 40);
  modal.then((ok) => {
    if (!ok) return;
    const name = $('#pageNameInput').value.trim();
    if (!name) { toast('名称不能为空', 'error'); return; }
    if (name === p.name) return;
    p.name = name;
    renderPageBar();
    sendOp({ type: 'rename-page', pageId: id, name });
  });
}

function deletePage(id) {
  if (!canEdit) return;
  if (roomData.pages.length <= 1) { toast('至少需要保留一个页面', 'error'); return; }
  const p = roomData.pages.find((x) => x.id === id);
  if (!p) return;
  const modal = openModal({
    title: '删除页面',
    body: '<p>确定删除「' + esc(p.name) + '」吗？<br>该页的全部画布内容将一并删除，<b>无法恢复</b>。</p>',
    buttons: [{ label: '取消', value: false }, { label: '删除', value: true, danger: true }],
  });
  modal.then((ok) => {
    if (!ok) return;
    const idx = roomData.pages.findIndex((x) => x.id === id);
    if (idx < 0) return;
    roomData.pages.splice(idx, 1);
    if (activePageId === id) switchPage(roomData.pages[0].id, true);
    renderPageBar();
    sendOp({ type: 'delete-page', pageId: id, name: p.name });
  });
}

// ---------- 用户显示名称 ----------
function updateDisplayName(name) {
  me.name = String(name).slice(0, 24);
  localStorage.setItem('dj_user', JSON.stringify(me));
  if (currentRoomId) socket.emit('update-user', { name: me.name });
  // 本地立即刷新自己的成员条目（服务端广播随后到达）
  const m = members.find((x) => x.userId === me.id);
  if (m) m.name = me.name;
  renderMembers();
  toast('显示名称已更新为「' + me.name + '」', 'ok');
}

// ---------- 设置 ----------
function openSettings() {
  if (!roomData) return;
  const roomSection = isAdmin
    ? '<div class="field"><label class="f-label">手账本名称</label><input type="text" id="setName" maxlength="40" value="' + esc(roomData.name) + '"></div>'
      + '<div class="field"><label class="f-label">访问密码（留空表示不修改；勾选下方可清除）</label><input type="password" id="setPass" placeholder="新密码"></div>'
      + '<div class="field"><label class="f-label"><input type="checkbox" id="setClearPass" style="accent-color:var(--accent)"> 清除现有密码</label></div>'
      + '<div class="field"><label class="f-label">编辑权限</label><div class="radio-row">'
      + '<label><input type="radio" name="setPerm" value="editable"' + (roomData.editPermission !== 'readonly' ? ' checked' : '') + '> 可编辑</label>'
      + '<label><input type="radio" name="setPerm" value="readonly"' + (roomData.editPermission === 'readonly' ? ' checked' : '') + '> 只读（仅创建者可编辑）</label>'
      + '</div></div>'
      + '<div class="field" style="border-top:1px solid var(--line);padding-top:12px"><button class="btn danger" id="setDeleteBtn">删除该手账本…</button></div>'
    : '<div class="room-info-box">名称：' + esc(roomData.name) + '<br>权限：' + (roomData.editPermission === 'readonly' ? '只读' : '可编辑') + '<br>您不是创建者，无法修改房间设置。</div>';

  const p = openModal({
    title: '设置',
    wide: true,
    body: '<div class="field"><label class="f-label">我的显示名称（同步给协作者）</label><input type="text" id="myNameInput" maxlength="24" value="' + esc(me.name) + '"></div>'
      + '<div style="border-top:1px solid var(--line);padding-top:12px;margin-top:14px">' + roomSection + '</div>',
    buttons: [{ label: '取消', value: false }, { label: '保存', value: true, primary: true }],
  });
  const delBtn = $('#setDeleteBtn');
  if (delBtn) delBtn.onclick = () => {
    openModal({
      title: '删除手账本',
      body: '<p>确定删除「' + esc(roomData.name) + '」吗？<br>全部画布数据与操作历史将一并删除，<b>无法恢复</b>。</p>',
      buttons: [{ label: '取消', value: false }, { label: '删除', value: true, danger: true }],
    }).then(async (ok) => {
      if (!ok) return;
      try {
        await fetchJSON('/api/rooms/' + roomData.id, { method: 'DELETE', body: JSON.stringify({ userId: me.id }) });
        toast('手账本已删除', 'ok');
        goHome();
      } catch (e) { toast(e.message, 'error'); }
    });
  };
  p.then(async (ok) => {
    if (!ok) return;
    // 我的显示名称（所有人可用）
    const myName = $('#myNameInput').value.trim();
    if (myName && myName !== me.name) updateDisplayName(myName);
    if (!isAdmin) return;
    // 房间设置（仅创建者）
    const name = $('#setName').value.trim();
    if (!name) { toast('名称不能为空', 'error'); return openSettings(); }
    const body = {
      userId: me.id,
      name,
      editPermission: document.querySelector('input[name=setPerm]:checked').value,
    };
    if ($('#setClearPass').checked) body.password = '';
    else if ($('#setPass').value) body.password = $('#setPass').value;
    try {
      const res = await fetchJSON('/api/rooms/' + roomData.id, { method: 'PATCH', body: JSON.stringify(body) });
      roomData.name = res.name;
      roomData.editPermission = res.editPermission;
      $('#roomName').textContent = res.name;
      updatePermUI();
      toast('设置已保存', 'ok');
    } catch (e) { toast(e.message, 'error'); }
  });
}

// ---------- 工具栏 / 快捷键 ----------
function setTool(t) {
  currentTool = t;
  for (const b of document.querySelectorAll('#toolbar .tool-btn')) {
    b.classList.toggle('active', b.dataset.tool === t);
  }
}

function setupSwatches() {
  const box = $('#swatches');
  const colors = ['#37352f', '#e34f4f', '#f08a24', '#e0a800', '#58a63f', '#2f9e9e', '#3a7bd5', '#7a5cd6', '#d6548f', '#888888'];
  box.innerHTML = colors.map((c) =>
    '<button class="swatch' + (c === toolColor ? ' active' : '') + '" style="background:' + c + '" data-color="' + c + '" title="' + c + '"></button>'
  ).join('');
  for (const sw of box.querySelectorAll('.swatch')) {
    sw.onclick = () => {
      toolColor = sw.dataset.color;
      for (const s of box.querySelectorAll('.swatch')) s.classList.remove('active');
      sw.classList.add('active');
    };
  }
}

function bindUI() {
  for (const b of document.querySelectorAll('#toolbar .tool-btn')) {
    if (b.id === 'btnUploadImage' || b.id === 'btnClearAnno') continue;
    b.onclick = () => setTool(b.dataset.tool);
  }
  $('#btnUploadImage').onclick = () => $('#imageInput').click();
  $('#imageInput').onchange = (e) => {
    const f = e.target.files[0];
    if (f) addImageFromFile(f);
    e.target.value = '';
  };
  $('#btnClearAnno').onclick = () => {
    if (!canEdit || !roomData || !roomData.annotations.length) return;
    openModal({
      title: '清空标注层',
      body: '<p>将删除全部笔迹、图形与文字（不影响图片层），确定吗？</p>',
      buttons: [{ label: '取消', value: false }, { label: '清空', value: true, danger: true }],
    }).then((ok) => {
      if (!ok) return;
      roomData.annotations = [];
      selectedId = null;
      updateInspector();
      sendOp({ type: 'clear-annotations' });
    });
  };

  $('#inspDelete').onclick = deleteSelected;
  $('#inspDuplicate').onclick = duplicateSelected;
  $('#inspFront').onclick = () => reorderSelected('front');
  $('#inspBack').onclick = () => reorderSelected('back');
  $('#inspRotL').onclick = () => rotateSelected(-15);
  $('#inspRotR').onclick = () => rotateSelected(15);

  $('#btnBack').onclick = goHome;
  $('#btnSettings').onclick = openSettings;
  $('#btnExport').onclick = openExportModal;
  $('#btnNewRoom').onclick = createRoomFlow;
  $('#btnAddPage').onclick = addPage;

  $('#zoomIn').onclick = () => {
    const r = canvasWrap.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.2);
  };
  $('#zoomOut').onclick = () => {
    const r = canvasWrap.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.2);
  };
  $('#zoomFit').onclick = resetZoom;

  // 侧栏收起 / 展开（记忆用户偏好）
  const sidebar = $('#sidebar');
  const applySidebarCollapsed = (collapsed) => {
    sidebar.classList.toggle('collapsed', collapsed);
    $('#btnSidebarToggle').textContent = collapsed ? '«' : '»';
    localStorage.setItem('dj_sidebar_collapsed', collapsed ? '1' : '0');
    resizeCanvas();
  };
  // 手机端首次使用默认收起侧栏，给画布留出空间；用户手动切换后记住选择
  const savedSidebar = localStorage.getItem('dj_sidebar_collapsed');
  applySidebarCollapsed(savedSidebar ? savedSidebar === '1' : window.innerWidth < 768);
  $('#btnSidebarToggle').onclick = () => applySidebarCollapsed(!sidebar.classList.contains('collapsed'));

  for (const tabBtn of document.querySelectorAll('.tabs button')) {
    tabBtn.onclick = () => {
      if (sidebar.classList.contains('collapsed')) applySidebarCollapsed(false);
      for (const b of document.querySelectorAll('.tabs button')) b.classList.remove('active');
      tabBtn.classList.add('active');
      $('#tab-history').classList.toggle('active', tabBtn.dataset.tab === 'history');
      $('#tab-members').classList.toggle('active', tabBtn.dataset.tab === 'members');
    };
  }

  document.addEventListener('keydown', (e) => {
    if (!$('#modalRoot').classList.contains('hidden')) return;
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
    if (e.key === ' ') { spaceDown = true; e.preventDefault(); return; }
    if (!roomData) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C') && selectedId) {
      const el = findElement(selectedId);
      if (el) { copyBuffer = el; toast('已复制元素，Ctrl+V 粘贴', 'ok'); }
    }
    else if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V') && copyBuffer) {
      e.preventDefault();
      const clone = duplicateElement(copyBuffer);
      if (clone.layer === 'image') { roomData.images.push(clone); ensureImage(clone); }
      else roomData.annotations.push(clone);
      selectedId = clone.id;
      sendOp({ type: 'duplicate', elements: [clone] });
      updateInspector();
    }
    else if (!e.ctrlKey && !e.metaKey && e.key === 'v') setTool('select');
    else if (e.key === 'p') setTool('pen');
    else if (e.key === 'e') setTool('eraser');
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === ' ') spaceDown = false;
  });
  window.addEventListener('blur', () => { spaceDown = false; });

  document.addEventListener('paste', (e) => {
    if (!currentRoomId || !canEdit || !roomData) return;
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const it of items) {
      if (it.type && it.type.startsWith('image/')) {
        e.preventDefault();
        const f = it.getAsFile();
        if (f) addImageFromFile(f);
        return;
      }
    }
  });

  // 点击元素信息菜单以外区域时隐藏
  document.addEventListener('pointerdown', (e) => {
    if (!e.target.closest || !e.target.closest('#elementMenu')) hideElementMenu();
  });
}

/* ==========================================================================
   导出：高清 PNG（透明 / 白底）与 PDF（A4 分页，纯 JS 生成）
   ========================================================================== */

function renderExportCanvas(page, bgWhite, scale) {
  const c = document.createElement('canvas');
  c.width = LOGICAL_W * scale;
  c.height = LOGICAL_H * scale;
  const ctx = c.getContext('2d');
  ctx.scale(scale, scale);
  if (bgWhite) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  }
  const ordered = page.images.concat(page.annotations)
    .sort((a, b) => elementZ(a, page.images, page.annotations) - elementZ(b, page.images, page.annotations));
  for (const el of ordered) {
    if (el.kind === 'image') {
      const img = imgCache.get(el.id);
      if (!img) continue;
      ctx.save();
      ctx.translate(el.x, el.y);
      ctx.rotate(el.rotation || 0);
      ctx.drawImage(img, -el.width / 2, -el.height / 2, el.width, el.height);
      ctx.restore();
    } else {
      drawAnnotation(ctx, el, false);
    }
  }
  return c;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function whenImagesReady() {
  const pending = [];
  for (const page of roomData.pages) {
    for (const im of page.images) {
      if (!imgCache.has(im.id)) pending.push(im);
    }
  }
  return Promise.all(pending.map((im) => new Promise((resolve) => {
    const check = () => {
      if (imgCache.has(im.id)) resolve();
      else setTimeout(check, 60);
    };
    check();
  })));
}

async function exportPNG(transparent) {
  toast('正在生成高清 PNG…');
  await whenImagesReady();
  const c = renderExportCanvas(activePage, !transparent, 2);
  c.toBlob((blob) => {
    if (blob) downloadBlob(blob, (roomData.name || '手账') + '-' + activePage.name + '.png');
  }, 'image/png');
}

function base64ToHex(b64) {
  const bin = atob(b64);
  let hex = '';
  const chunk = 0x8000;
  for (let i = 0; i < bin.length; i += chunk) {
    let s = '';
    const end = Math.min(bin.length, i + chunk);
    for (let j = i; j < end; j++) s += bin.charCodeAt(j).toString(16).padStart(2, '0');
    hex += s + '\n';
  }
  return hex;
}

async function exportPDF() {
  toast('正在生成 PDF…（共 ' + roomData.pages.length + ' 页）');
  // 未加载的页面先按需拉取，确保导出不丢内容
  pageLoading = true;
  showLoading(true);
  for (const p of roomData.pages) {
    if (!p.loaded) {
      const ok = await loadPageContent(p.id);
      if (!ok) toast('页面「' + p.name + '」加载失败，导出已跳过', 'error');
    }
  }
  pageLoading = false;
  showLoading(false);
  await whenImagesReady();
  const pageW = 595.28, pageH = 841.89; // A4（pt）
  const scale = pageW / LOGICAL_W;

  const objs = {};
  let nextId = 1;
  objs[nextId++] = '<< /Type /Catalog /Pages 2 0 R >>';

  // 每个手账页渲染成一张 JPEG，作为 PDF 的一页 A4
  const imgIds = [];
  for (const page of roomData.pages) {
    const c = renderExportCanvas(page, true, 1.5);
    const hex = base64ToHex(c.toDataURL('image/jpeg', 0.92).split(',')[1]);
    imgIds.push(nextId);
    objs[nextId++] = '<< /Type /XObject /Subtype /Image /Width ' + LOGICAL_W + ' /Height ' + LOGICAL_H
      + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter [/ASCIIHexDecode /DCTDecode] /Length ' + (hex.length + 1) + ' >>\nstream\n'
      + hex + '>\nendstream';
  }

  const kids = [];
  for (let i = 0; i < roomData.pages.length; i++) {
    const stream = 'q\n' + scale + ' 0 0 ' + scale + ' 0 0 cm\n/Im' + i + ' Do\nQ';
    const contentId = nextId++;
    objs[contentId] = '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream';
    const pageId = nextId++;
    objs[pageId] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageW + ' ' + pageH + ']'
      + ' /Resources << /XObject << /Im' + i + ' ' + imgIds[i] + ' 0 R >> >> /Contents ' + contentId + ' 0 R >>';
    kids.push(pageId);
  }
  objs[2] = '<< /Type /Pages /Kids [' + kids.map((id) => id + ' 0 R').join(' ') + '] /Count ' + kids.length + ' >>';

  let out = '%PDF-1.4\n';
  const offsets = [0];
  for (let id = 1; id < nextId; id++) {
    offsets[id] = out.length;
    out += id + ' 0 obj\n' + objs[id] + '\nendobj\n';
  }
  const xrefStart = out.length;
  out += 'xref\n0 ' + nextId + '\n0000000000 65535 f \n';
  for (let id = 1; id < nextId; id++) {
    out += String(offsets[id]).padStart(10, '0') + ' 00000 n \n';
  }
  out += 'trailer\n<< /Size ' + nextId + ' /Root 1 0 R >>\nstartxref\n' + xrefStart + '\n%%EOF';

  downloadBlob(new Blob([out], { type: 'application/pdf' }), (roomData.name || '手账') + '.pdf');
  toast('PDF 已导出', 'ok');
}

function openExportModal() {
  if (!roomData) return;
  openModal({
    title: '导出',
    body: '<p style="margin-bottom:12px">PNG 导出当前页「' + esc(activePage.name) + '」；PDF 导出全部 ' + roomData.pages.length + ' 个页面（每页一张 A4，不含选中框与光标）：</p>'
      + '<div style="display:flex;flex-wrap:wrap;gap:8px">'
      + '<button class="btn" id="expPngT">PNG · 透明背景</button>'
      + '<button class="btn" id="expPngW">PNG · 白色背景</button>'
      + '<button class="btn" id="expPdf">PDF · A4 分页</button>'
      + '</div>',
    buttons: [{ label: '关闭', value: false }],
  });
  $('#expPngT').onclick = () => exportPNG(true);
  $('#expPngW').onclick = () => exportPNG(false);
  $('#expPdf').onclick = exportPDF;
}

/* ==========================================================================
   启动
   ========================================================================== */
function init() {
  setupSwatches();
  bindUI();
  setupCanvas();
  loadRooms();
  initIDB().catch(() => {});
}

init();
</script>
