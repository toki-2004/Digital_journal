<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>拾光手账 · 实时协同电子手账</title>
<style>
/* ==========================================================================
   拾光手账 - 前端样式（无第三方依赖，系统字体，Notion 风格）
   ========================================================================== */
:root {
  --bg: #f7f7f5;
  --card: #ffffff;
  --ink: #37352f;
  --muted: #9b9a97;
  --line: #e9e9e7;
  --accent: #2f6feb;
  --accent-soft: #eaf1fe;
  --danger: #e5484d;
  --ok: #3aa76d;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(15,15,15,.08), 0 4px 16px rgba(15,15,15,.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 14px; }

/* ---------- 通用按钮 ---------- */
.btn {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 13px;
  transition: background .15s, border-color .15s, box-shadow .15s;
}
.btn:hover { background: #f3f3f2; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #245cd0; }
.btn.danger { color: var(--danger); border-color: #f2c6c8; }
.btn.danger:hover { background: #fdf0f0; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink); }
.btn.ghost:hover { background: rgba(0,0,0,.06); }
.icon-btn {
  border: none; background: transparent; color: var(--ink);
  width: 30px; height: 30px; border-radius: 7px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px; transition: background .15s;
}
.icon-btn:hover { background: rgba(0,0,0,.07); }

/* ---------- 首页：房间列表 ---------- */
#homeView { min-height: 100vh; }
.home-header {
  max-width: 1060px; margin: 0 auto; padding: 34px 24px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #7aa2f7, #5b6ee1);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 20px; box-shadow: var(--shadow);
}
.brand h1 { font-size: 19px; font-weight: 600; letter-spacing: .5px; }
.home-header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.room-grid {
  max-width: 1060px; margin: 8px auto 40px; padding: 0 24px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(225px, 1fr)); gap: 18px;
}
.room-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s; position: relative;
}
.room-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(15,15,15,.1), 0 12px 28px rgba(15,15,15,.08); }
.room-cover { height: 118px; background: linear-gradient(135deg, #eef2ff, #f7f0ff); position: relative; }
.room-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-placeholder {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 42px; color: rgba(255,255,255,.92); font-weight: 600;
}
.room-badges { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.badge {
  background: rgba(0,0,0,.55); color: #fff; font-size: 11px;
  padding: 2px 7px; border-radius: 20px; backdrop-filter: blur(2px);
}
.room-meta { padding: 12px 14px 14px; }
.room-name { font-size: 15px; font-weight: 600; margin-bottom: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room-time { color: var(--muted); font-size: 12px; }
.room-actions {
  position: absolute; top: 8px; left: 8px; display: none; gap: 4px;
}
.room-card:hover .room-actions { display: flex; }
.room-actions .icon-btn { background: rgba(255,255,255,.92); box-shadow: 0 1px 4px rgba(0,0,0,.18); width: 26px; height: 26px; font-size: 13px; }
.room-actions .icon-btn.del:hover { background: #fdecec; color: var(--danger); }
.empty-tip {
  grid-column: 1 / -1; text-align: center; color: var(--muted);
  padding: 70px 20px; border: 1.5px dashed #d8d8d4; border-radius: var(--radius);
}
.empty-tip .big { font-size: 40px; margin-bottom: 10px; }
.home-footer { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 20px 34px; }

/* ---------- 编辑器布局 ---------- */
#editorView { display: flex; flex-direction: column; height: 100vh; }
.topbar {
  height: 50px; flex: 0 0 50px; background: var(--card);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
}
.room-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.room-title #roomName { font-weight: 600; font-size: 15px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.perm-badge { font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 20px; padding: 2px 8px; white-space: nowrap; }
.perm-badge.ro { color: #8a6d1c; background: #fbf3d9; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.save-state { color: var(--muted); font-size: 12px; }
.save-state.saving { color: #c47f17; }
.status { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.status.on i { background: var(--ok); }
.status.off i { background: var(--danger); }
.member-count { font-size: 12px; color: var(--muted); }

.editor-body { flex: 1; display: flex; min-height: 0; }

/* ---------- 左侧工具栏 ---------- */
.toolbar {
  width: 58px; flex: 0 0 58px; background: var(--card);
  border-right: 1px solid var(--line); padding: 10px 7px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; overflow-y: auto;
}
.tool-btn {
  width: 44px; height: 40px; border: none; background: transparent; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; color: var(--ink);
  position: relative; transition: background .12s;
}
.tool-btn svg { width: 20px; height: 20px; }
.tool-btn:hover { background: #f0f0ee; }
.tool-btn.active { background: var(--accent-soft); color: var(--accent); }
.tool-btn:disabled { opacity: .35; cursor: not-allowed; }
.tool-btn .kbd {
  position: absolute; right: 3px; bottom: 1px; font-size: 8px; color: var(--muted);
  background: #f0f0ee; border-radius: 3px; padding: 0 2px; line-height: 11px;
}
.tool-divider { width: 32px; height: 1px; background: var(--line); margin: 7px 0; }
.tool-settings { display: flex; flex-direction: column; align-items: center; gap: 7px; padding-top: 6px; }
.swatches { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
.swatch {
  width: 17px; height: 17px; border-radius: 50%; border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.14); cursor: pointer; padding: 0;
}
.swatch.active { box-shadow: 0 0 0 2px var(--accent); }
.range-row { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.range-row label { font-size: 10px; color: var(--muted); }
.range-row input[type=range] { width: 42px; accent-color: var(--accent); }

/* ---------- 画布区域 ---------- */
.canvas-area {
  flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
  padding: 18px; position: relative; overflow: hidden;
}
.canvas-wrap {
  position: relative; box-shadow: var(--shadow);
  border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
  background: #ececea; touch-action: none;
}
#board { display: block; position: absolute; left: 0; top: 0; touch-action: none; }
#cursorLayer { position: absolute; inset: 0; pointer-events: none; }
.remote-cursor { position: absolute; display: flex; align-items: center; gap: 4px; transform: translate(-1px, -1px); transition: opacity .15s; }
.remote-cursor .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.remote-cursor .nm {
  font-size: 11px; color: #fff; padding: 1px 6px; border-radius: 8px;
  white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.text-edit {
  position: absolute; border: 2px solid var(--accent); border-radius: 4px;
  background: rgba(255,255,255,.96); padding: 3px 6px; font-family: inherit;
  outline: none; min-width: 80px; resize: none; overflow: hidden; z-index: 30;
  box-shadow: 0 2px 10px rgba(0,0,0,.18); white-space: pre;
}
.float-inspector {
  position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%);
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 2px;
  padding: 4px 6px; z-index: 20; white-space: nowrap;
  max-width: calc(100% - 16px); flex-wrap: wrap; justify-content: center;
}
.float-inspector .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.float-inspector .rot-hint { font-size: 11px; color: var(--muted); padding: 0 4px; white-space: nowrap; }
.float-inspector .lock-note { font-size: 11px; color: var(--danger); padding: 0 6px; }
.float-inspector .creator-note { font-size: 11px; color: var(--muted); padding: 0 4px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.readonly-banner {
  position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
  background: #fbf3d9; color: #8a6d1c; font-size: 12px; border-radius: 20px;
  padding: 4px 12px; z-index: 15; box-shadow: 0 1px 4px rgba(0,0,0,.12);
}

/* ---------- 页面栏与缩放控件 ---------- */
.page-bar {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px; max-width: 78%;
  background: rgba(255,255,255,.95); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); padding: 4px; z-index: 18;
  backdrop-filter: blur(3px);
}
.page-tabs { display: flex; gap: 3px; overflow-x: auto; max-width: 100%; }
.page-tab {
  display: flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 7px;
  font-size: 12.5px; color: var(--ink); cursor: pointer; white-space: nowrap;
  border: 1px solid transparent; user-select: none;
}
.page-tab:hover { background: #f0f0ee; }
.page-tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.page-tab .pt-del { color: var(--muted); font-size: 13px; line-height: 1; padding: 1px 3px; border-radius: 4px; }
.page-tab .pt-del:hover { color: var(--danger); background: #fdecec; }
.page-add { border: none; background: transparent; color: var(--accent); font-size: 17px; padding: 4px 9px; border-radius: 7px; }
.page-add:hover { background: var(--accent-soft); }
.page-add:disabled { opacity: .35; cursor: not-allowed; }
.zoom-pill {
  position: absolute; right: 22px; bottom: 60px; z-index: 18;
  display: flex; align-items: center; gap: 2px;
  background: rgba(255,255,255,.95); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); padding: 3px 4px;
}
.zoom-pill .zp-btn { border: none; background: transparent; width: 26px; height: 26px; border-radius: 6px; font-size: 15px; color: var(--ink); }
.zoom-pill .zp-btn:hover { background: #f0f0ee; }
.zoom-pill .zp-pct { font-size: 11.5px; color: var(--muted); min-width: 44px; text-align: center; user-select: none; }
.zoom-pill .zp-fit { border: none; background: transparent; font-size: 11px; color: var(--accent); padding: 4px 7px; border-radius: 6px; }
.zoom-pill .zp-fit:hover { background: var(--accent-soft); }
.element-menu {
  position: absolute; z-index: 40; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 10px 12px; min-width: 190px; font-size: 12.5px;
}
.element-menu .em-title { font-weight: 600; margin-bottom: 6px; font-size: 13px; }
.element-menu .em-row { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; color: var(--muted); }
.element-menu .em-row b { color: var(--ink); font-weight: 500; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.page-loading {
  position: absolute; inset: 0; z-index: 45; background: rgba(255,255,255,.78);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  color: var(--muted); font-size: 13px; backdrop-filter: blur(2px);
}
.pl-spinner { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 右侧边栏 ---------- */
.sidebar {
  width: 292px; flex: 0 0 292px; background: var(--card);
  border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  transition: width .18s ease, flex-basis .18s ease;
}
.sidebar-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px 4px 14px;
}
.sh-title { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 1px; }
.sidebar.collapsed { width: 46px; flex: 0 0 46px; }
.sidebar.collapsed .sidebar-head { justify-content: center; padding: 8px 4px 4px; }
.sidebar.collapsed .sh-title { display: none; }
.sidebar.collapsed .tabs { flex-direction: column; border-bottom: none; }
.sidebar.collapsed .tabs button { padding: 13px 0; font-size: 12px; border-bottom: 2px solid transparent; border-left: 2px solid transparent; }
.sidebar.collapsed .tabs button.active { border-bottom-color: transparent; border-left-color: var(--ink); }
.sidebar.collapsed .tab-panel { display: none !important; }
.footer-github { margin-top: 8px; }
.footer-github a { color: var(--accent); text-decoration: none; }
.footer-github a:hover { text-decoration: underline; }
.footer-github .dot { color: #d0d0cc; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button {
  flex: 1; border: none; background: transparent; padding: 11px 0; font-size: 13px;
  color: var(--muted); border-bottom: 2px solid transparent; transition: color .12s;
}
.tabs button.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.tab-panel { flex: 1; overflow-y: auto; min-height: 0; display: none; }
.tab-panel.active { display: block; }

.timeline { padding: 12px 14px; position: relative; }
.timeline::before {
  content: ""; position: absolute; left: 24px; top: 14px; bottom: 14px; width: 2px;
  background: #efefec; border-radius: 2px;
}
.tl-item { position: relative; padding: 0 0 16px 34px; }
.tl-item::before {
  content: ""; position: absolute; left: 18px; top: 4px; width: 12px; height: 12px;
  border-radius: 50%; background: #fff; border: 2.5px solid var(--accent);
}
.tl-time { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.tl-text { font-size: 12.5px; line-height: 1.55; color: var(--ink); word-break: break-all; }
.tl-empty { color: var(--muted); font-size: 12px; padding: 30px 18px; text-align: center; }

.member-list { padding: 8px 0; }
.member-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px; }
.member-row .avatar {
  width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 12px;
  display: flex; align-items: center; justify-content: center; flex: 0 0 26px;
}
.member-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member-row .tag { font-size: 10px; color: var(--muted); background: #f0f0ee; border-radius: 10px; padding: 1px 7px; }
.member-row .tag.me { color: var(--accent); background: var(--accent-soft); }
.member-row .tag.admin { color: #9a6b00; background: #fbf3d9; }
.member-row .tag.page { color: #4a7d4a; background: #eaf5ea; }
.member-row .cursor-pos { font-size: 11px; color: var(--muted); }

/* ---------- 弹窗与提示 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15,15,15,.42); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn .14s ease;
}
.modal-card {
  background: var(--card); border-radius: 14px; width: 100%; max-width: 430px;
  box-shadow: 0 8px 40px rgba(0,0,0,.22); animation: popIn .16s ease; overflow: hidden;
}
.modal-card.wide { max-width: 520px; }
.modal-head { padding: 18px 20px 0; font-size: 16px; font-weight: 600; }
.modal-body { padding: 16px 20px 6px; font-size: 13.5px; line-height: 1.7; }
.modal-body .field { margin-bottom: 14px; }
.modal-body label.f-label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
.modal-body input[type=text], .modal-body input[type=password], .modal-body textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; outline: none;
  transition: border-color .12s;
}
.modal-body input:focus, .modal-body textarea:focus { border-color: var(--accent); }
.modal-body .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
.radio-row { display: flex; gap: 18px; }
.radio-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
.radio-row input { accent-color: var(--accent); }
.cover-picker { display: flex; align-items: center; gap: 12px; }
.cover-picker img, .cover-picker .no-cover {
  width: 72px; height: 48px; border-radius: 8px; object-fit: cover;
  border: 1px solid var(--line); background: #f0f0ee; flex: 0 0 72px;
  display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px;
}
.modal-actions { padding: 10px 20px 18px; display: flex; justify-content: flex-end; gap: 8px; }
.modal-actions .spacer { flex: 1; }
.room-info-box {
  background: #f8f8f7; border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 12px; margin-bottom: 14px; font-size: 12.5px; color: var(--muted);
}

#toastRoot { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: #2f2e2b; color: #fff; font-size: 13px; padding: 9px 18px; border-radius: 22px;
  box-shadow: 0 4px 16px rgba(0,0,0,.28); animation: popIn .18s ease; max-width: 70vw;
}
.toast.error { background: var(--danger); }
.toast.ok { background: var(--ok); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.96) translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #d4d4d0; border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: #bdbdb8; }

/* ---------- 移动端适配 ---------- */
@media (max-width: 768px) {
  .canvas-area { padding: 8px; }
  .toolbar { width: 48px; flex: 0 0 48px; padding: 8px 4px; }
  .tool-btn { width: 40px; }
  .sidebar { width: 220px; flex: 0 0 220px; }
  .sidebar.collapsed { width: 40px; flex: 0 0 40px; }
  .topbar-right .save-state, .topbar-right .member-count { display: none; }
  .room-title #roomName { max-width: 130px; }
  .home-header { padding: 20px 14px 12px; }
  .room-grid { padding: 0 14px 30px; }
  .page-bar { bottom: 56px; }
  .zoom-pill { right: 12px; bottom: 102px; }
  .float-inspector { bottom: 102px; left: 8px; right: 176px; transform: none; max-width: none; justify-content: flex-start; }
}
</style>
</head>
<body>

<!-- ================= 首页 ================= -->
<div id="homeView">
  <header class="home-header">
    <div>
      <div class="brand">
        <div class="brand-logo">✎</div>
        <div>
          <h1>拾光手账</h1>
          <div class="sub">自托管 · 实时协同电子手账</div>
        </div>
      </div>
    </div>
    <button class="btn primary" id="btnNewRoom">＋ 新建手账本</button>
  </header>
  <main class="room-grid" id="roomGrid"></main>
  <footer class="home-footer">
    <div>数据保存在服务器 ./data/ 目录下的 JSON 文件 · 浏览器端另有 IndexedDB 本地缓存</div>
    <div class="footer-github">
      <a href="https://github.com/toki-2004/Digital_journal" target="_blank" rel="noopener">GitHub：toki-2004/Digital_journal</a>
    </div>
  </footer>
</div>

<!-- ================= 编辑器 ================= -->
<div id="editorView" class="hidden">
  <header class="topbar">
    <button class="icon-btn" id="btnBack" title="返回首页">←</button>
    <div class="room-title">
      <span id="roomName">未命名</span>
      <span class="perm-badge" id="permBadge">可编辑</span>

<script>
'use strict';
/* ==========================================================================
   前端核心：工具函数、用户身份、IndexedDB、弹窗、Socket、首页

// ---------- 基础常量与工具 ----------
const LOGICAL_W = 1400;   // 画布逻辑宽度（px）
const LOGICAL_H = 1980;   // 画布逻辑高度（px，A4 比例）
const DB_NAME = 'digital-journal';

const $ = (sel, el = document) => el.querySelector(sel);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => 'e_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function relTime(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  const diff = Date.now() - t;
  if (diff < 60e3) return '刚刚';
  if (diff < 3600e3) return Math.floor(diff / 60e3) + ' 分钟前';
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + ' 小时前';
  if (diff < 7 * 86400e3) return Math.floor(diff / 86400e3) + ' 天前';
  return new Date(iso).toLocaleDateString('zh-CN');
}

function fetchJSON(url, options, timeout = 12000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeout);
  return fetch(url, Object.assign({
    headers: { 'Content-Type': 'application/json' },
    signal: ctrl.signal,
  }, options))
    .then(async (res) => {
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || ('请求失败（HTTP ' + res.status + '）'));
      }
      return res.json();
    })
    .finally(() => clearTimeout(t));
}

// ---------- 用户身份（localStorage） ----------
const USER_COLORS = ['#e34f4f', '#f08a24', '#e0a800', '#58a63f', '#2f9e9e', '#3a7bd5', '#7a5cd6', '#d6548f', '#c74e4e', '#4c7dd8'];
const NAME_A = ['柠', '云', '星', '月', '林', '海', '风', '雪', '橘', '莓', '桃', '溪', '柚', '芋', '苏', '雾'];
const NAME_B = ['猫', '狐', '兔', '鹿', '熊', '鲸', '雀', '鸭', '羊', '犬', '鹰', '蝶'];

function loadIdentity() {
  let u = null;
  try { u = JSON.parse(localStorage.getItem('dj_user')); } catch (e) { /* 忽略 */ }
  if (!u || !u.id) {
    u = {
      id: 'u_' + Math.random().toString(36).slice(2, 10),
      name: NAME_A[Math.floor(Math.random() * NAME_A.length)] + NAME_B[Math.floor(Math.random() * NAME_B.length)] + '#' + Math.random().toString(16).slice(2, 4),
      color: USER_COLORS[Math.floor(Math.random() * USER_COLORS.length)],
    };
    localStorage.setItem('dj_user', JSON.stringify(u));
  }
  return u;
}
const me = loadIdentity();

// ---------- IndexedDB 本地缓存 ----------
let idbReady = null;
function initIDB() {
  if (idbReady) return idbReady;
  idbReady = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { resolve(null); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('rooms', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return idbReady;
}

function idbPut(roomData) {
  return initIDB().then((db) => new Promise((resolve) => {
    if (!db) return resolve();
    const tx = db.transaction('rooms', 'readwrite');
    tx.objectStore('rooms').put(roomData);
    tx.oncomplete = () => resolve();
    tx.onerror = () => resolve();
  }));
}

function idbGet(id) {
  return initIDB().then((db) => new Promise((resolve) => {
    if (!db) return resolve(null);
    const req = db.transaction('rooms').objectStore('rooms').get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  }));
}

// ---------- 弹窗 ----------
function openModal({ title, body, buttons, wide }) {
  return new Promise((resolve) => {
    const root = $('#modalRoot');
    root.classList.remove('hidden');
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = body;
    $('#modalCard').classList.toggle('wide', !!wide);
    const actions = $('#modalActions');
    actions.innerHTML = '';

    const closeModal = (val) => {
      root.classList.add('hidden');
      document.removeEventListener('keydown', onKey);
      resolve(val);
    };
    const onKey = (e) => { if (e.key === 'Escape') closeModal(false); };
    document.addEventListener('keydown', onKey);
    root.querySelector('.modal-mask').onclick = (e) => {
      if (e.target.classList.contains('modal-mask')) closeModal(false);
    };

    if (buttons) {
      for (const b of buttons) {
        const el = document.createElement('button');
        el.className = 'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : '') + (b.ghost ? ' ghost' : '');
        el.textContent = b.label;
        el.onclick = () => closeModal(b.value);
        actions.appendChild(el);
      }
    }
  });
}

// ---------- Toast 提示 ----------
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toastRoot').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .35s';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 400);
  }, 2400);
}

// ---------- 图片压缩（长边不超过 maxSide，避免 JSON 文件膨胀） ----------
function compressImage(file, maxSide = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const s = Math.min(1, maxSide / Math.max(w, h));
      w = Math.max(1, Math.round(w * s));
      h = Math.max(1, Math.round(h * s));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const isPng = /png|gif|webp/i.test(file.type);
      resolve(isPng ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
    img.src = url;
  });
}

// ---------- Socket.io 连接与全局事件 ----------
const socket = io();
let members = [];                 // 在线成员（服务端下发）
const memberCursors = new Map();  // userId -> {x,y,name,color}
let locks = new Map();            // elementId -> lock
let currentRoomId = null;
let viewScale = 1;

socket.on('connect', () => { setConn('on'); });
socket.on('disconnect', () => { setConn('off'); });
socket.on('connect_error', () => { setConn('off'); });

socket.on('members', (list) => {
  members = list || [];
  // 清掉已不在线成员的光标
  const ids = new Set(members.map((m) => m.userId));
  for (const k of Array.from(memberCursors.keys())) if (!ids.has(k)) memberCursors.delete(k);
  // 同步成员所在页面
  for (const m of members) {
    const cur = memberCursors.get(m.userId);
    if (cur) cur.pageId = m.pageId || null;
  }
  renderMembers();
});

socket.on('cursor', (p) => {
  memberCursors.set(p.userId, { x: p.x, y: p.y, name: p.name, color: p.color, pageId: p.pageId || null });
  renderCursorLayer();
  renderMembers();
});

socket.on('member-page', (p) => {
  const cur = memberCursors.get(p.userId);
  if (cur) cur.pageId = p.pageId || null;
  const m = members.find((x) => x.userId === p.userId);
  if (m) m.pageId = p.pageId || null;
  renderCursorLayer();
  renderMembers();
});

socket.on('element-locked', (p) => {
  locks.set(p.elementId, p.lock);
});

socket.on('element-unlocked', (p) => {
  locks.delete(p.elementId);
  if (selectedId === p.elementId && !locks.has(p.elementId) && currentAction && currentAction.type === 'move') {
    // 自己持有的锁被服务器释放（异常情况），结束当前动作
  }
});

socket.on('room-settings', (p) => {
  if (!roomData) return;
  roomData.name = p.name;
  roomData.editPermission = p.editPermission;
  $('#roomName').textContent = p.name;
  updatePermUI();
  toast('房间设置已更新');
});

socket.on('room-deleted', () => {
  toast('手账本已被创建者删除', 'error');
  goHome();
});

// ---------- 连接状态 ----------
function setConn(state) {
  const el = $('#connStatus');
  const txt = $('#connText');
  el.classList.remove('on', 'off');
  if (state === 'on') { el.classList.add('on'); txt.textContent = '已连接'; }
  else if (state === 'off') { el.classList.add('off'); txt.textContent = '已断开'; }
  else { txt.textContent = '连接中…'; }
}

// ---------- 首页：房间列表 ----------
const COVER_GRADIENTS = [
  'linear-gradient(135deg,#8ea8f5,#b59df0)',
  'linear-gradient(135deg,#7fd4c1,#6bb5e8)',
  'linear-gradient(135deg,#f5b37e,#f08aa8)',
  'linear-gradient(135deg,#a8d67f,#67b99a)',
  'linear-gradient(135deg,#e8b66b,#e88f6b)',
  'linear-gradient(135deg,#9aa5f0,#7f8fd8)',
];

async function loadRooms() {
  try {
    const list = await fetchJSON('/api/rooms', {}, 8000);
    renderRoomGrid(list);
  } catch (e) {
    $('#roomGrid').innerHTML = '<div class="empty-tip"><div class="big">⚠️</div>无法连接服务器：' + esc(e.message) + '<br><br>请先运行 <b>node server.js</b></div>';
  }
}

function roomGradient(id) {
  let h = 0;
  for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return COVER_GRADIENTS[h % COVER_GRADIENTS.length];
}

function renderRoomGrid(list) {
  const grid = $('#roomGrid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty-tip"><div class="big">📖</div>还没有手账本<br>点击右上角「新建手账本」开始记录</div>';
    return;
  }
  grid.innerHTML = list.map((r) => {
    const cover = r.cover
      ? '<img src="' + r.cover + '" alt="封面">'
      : '<div class="cover-placeholder" style="background:' + roomGradient(r.id) + '">' + esc(r.name.slice(0, 1)) + '</div>';
    const badges = (r.hasPassword ? '<span class="badge">🔒 密码</span>' : '') + (r.editPermission === 'readonly' ? '<span class="badge">只读</span>' : '');
    return '<div class="room-card" data-id="' + esc(r.id) + '">'
      + '<div class="room-actions">'
      + '<button class="icon-btn" data-act="rename" title="重命名">✎</button>'
      + '<button class="icon-btn del" data-act="delete" title="删除">🗑</button>'
      + '</div>'
      + '<div class="room-cover">' + cover + (badges ? '<div class="room-badges">' + badges + '</div>' : '') + '</div>'
      + '<div class="room-meta"><div class="room-name">' + esc(r.name) + '</div><div class="room-time">最后编辑：' + relTime(r.lastModified) + '</div></div>'
      + '</div>';
  }).join('');

  for (const card of grid.querySelectorAll('.room-card')) {
    const room = list.find((r) => r.id === card.dataset.id);
    card.addEventListener('click', (e) => {
      if (e.target.closest('[data-act]')) return;
      joinRoom(room);
    });
    card.querySelector('[data-act=rename]').onclick = (e) => { e.stopPropagation(); renameRoom(room); };
    card.querySelector('[data-act=delete]').onclick = (e) => { e.stopPropagation(); deleteRoom(room); };
  }
}

async function createRoomFlow() {
  const form = await (() => {
    const p = openModal({
      title: '新建手账本',
      body: '<div class="field"><label class="f-label">名称</label><input type="text" id="crName" maxlength="40" placeholder="例如：旅行手账"></div>'
        + '<div class="field"><label class="f-label">访问密码（可选，留空则无需密码）</label><input type="password" id="crPass" placeholder="协作者需要密码才能进入"></div>'
        + '<div class="field"><label class="f-label">编辑权限</label><div class="radio-row">'
        + '<label><input type="radio" name="crPerm" value="editable" checked> 可编辑（协作者可共同绘制）</label>'
        + '<label><input type="radio" name="crPerm" value="readonly"> 只读（仅创建者可编辑）</label>'
        + '</div></div>'
        + '<div class="field"><label class="f-label">封面（可选）</label>'
        + '<div class="cover-picker"><div id="crCover" class="no-cover">封面</div>'
        + '<div style="display:flex;gap:8px"><button type="button" class="btn" id="crCoverBtn">上传封面</button><button type="button" class="btn ghost" id="crCoverClear">移除</button></div>'
        + '<input type="file" id="crCoverInput" accept="image/*" class="hidden"></div></div>',
      buttons: [{ label: '取消', value: false }, { label: '创建', value: true, primary: true }],
    });
    return p;
  })();

  let coverData = null;
  const input = $('#crCoverInput');
  const preview = $('#crCover');
  $('#crCoverBtn').onclick = () => input.click();
  $('#crCoverClear').onclick = () => { coverData = null; preview.style.background = ''; preview.textContent = '封面'; preview.classList.add('no-cover'); };
  input.onchange = async () => {
    const f = input.files[0];
    if (!f) return;
    try {
      coverData = await compressImage(f, 360, 0.8);
      preview.style.background = 'url(' + coverData + ') center/cover';
      preview.textContent = '';
      preview.classList.remove('no-cover');
    } catch (e) { toast(e.message, 'error'); }
  };

  const ok = await form;
  if (!ok) return;
  const name = $('#crName').value.trim();
  if (!name) { toast('请填写手账本名称', 'error'); return createRoomFlow(); }
  const password = $('#crPass').value;
  const editPermission = document.querySelector('input[name=crPerm]:checked').value;
  try {
    await fetchJSON('/api/rooms', {
      method: 'POST',
      body: JSON.stringify({ name, password, editPermission, cover: coverData, user: me }),
    });
    toast('手账本创建成功', 'ok');
    loadRooms();
  } catch (e) { toast(e.message, 'error'); }
}

function renameRoom(room) {
  const p = openModal({
    title: '重命名手账本',
    body: '<div class="field"><label class="f-label">名称</label><input type="text" id="rnName" maxlength="40" value="' + esc(room.name) + '"></div>',
    buttons: [{ label: '取消', value: false }, { label: '保存', value: true, primary: true }],
  });
  setTimeout(() => { const el = $('#rnName'); if (el) { el.focus(); el.select(); } }, 40);
  p.then(async (ok) => {
    if (!ok) return;
    const name = $('#rnName').value.trim();
    if (!name) { toast('名称不能为空', 'error'); return renameRoom(room); }

    } catch (e) { toast(e.message, 'error'); }
  });
}

function deleteRoom(room) {

async function joinRoom(room) {

/* ==========================================================================
   编辑器：画布渲染、绘图工具、实时同步、乐观锁、历史记录
   ========================================================================== */

// ---------- 状态 ----------
let roomData = null;
let activePage = null;
let activePageId = null;
let canvasEl = null;
let ctx2d = null;
let canvasWrap = null;
let currentTool = 'select';
let toolColor = '#e34f4f';
let selectedId = null;
let hoveredId = null;
let currentAction = null;
let isAdmin = false;
let canEdit = true;
let joinPassword = '';
let copyBuffer = null;
let lastCursorSent = 0;
let rafId = null;
let fitScale = 1;      // 页面完整适应窗口时的缩放
let zoom = 1;          // 用户缩放倍率（1 = 适应窗口）
let panX = 0, panY = 0; // 平移偏移（CSS 像素）
const activePointers = new Map();
let pinch = null;
let spaceDown = false;
let pressTimer = null;   // 触屏长按定时器
let pressInfo = null;    // 触屏按下时的候选元素
let longPressActive = false;
const imgCache = new Map(); // imageId -> HTMLImageElement

function findElement(id) {
  if (!roomData) return null;
  return roomData.images.find((e) => e.id === id) || roomData.annotations.find((e) => e.id === id) || null;
}

function snapshotForIDB() {
  if (!roomData) return null;
  return {
    id: roomData.id,
    name: roomData.name,
    editPermission: roomData.editPermission,
    createdBy: roomData.createdBy,
    createdAt: roomData.createdAt,
    lastModified: roomData.lastModified,
    revision: roomData.revision || 0,
    activePageId,
    pages: roomData.pages.map((p) => ({
      id: p.id,
      name: p.name,
      loaded: !!p.loaded,
      images: p.loaded ? JSON.parse(JSON.stringify(p.images)) : [],
      annotations: p.loaded ? JSON.parse(JSON.stringify(p.annotations)) : [],
    })),
    history: JSON.parse(JSON.stringify(roomData.history || [])),
  };
}

// ---------- 画布初始化 ----------
function setupCanvas() {
  canvasEl = $('#board');
  ctx2d = canvasEl.getContext('2d');
  canvasWrap = $('#canvasWrap');
  canvasEl.width = LOGICAL_W * (window.devicePixelRatio || 1);
  canvasEl.height = LOGICAL_H * (window.devicePixelRatio || 1);
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  // 编辑器从隐藏变为可见、或布局尺寸变化时，自动重新计算画布大小
  const area = $('.canvas-area');
  if (typeof ResizeObserver !== 'undefined' && area) {
    new ResizeObserver(() => resizeCanvas()).observe(area);
  }
  bindCanvasEvents();
  rafId = requestAnimationFrame(loop);
}

function resizeCanvas() {
  if (!canvasWrap || !canvasEl) return; // 画布尚未初始化时安全跳过
  const area = $('.canvas-area');
  const aw = area.clientWidth;
  const ah = area.clientHeight;
  canvasWrap.style.width = aw + 'px';
  canvasWrap.style.height = ah + 'px';
  fitScale = clamp(Math.min(aw / LOGICAL_W, ah / LOGICAL_H), 0.1, 1);
  layoutCanvas();
}

/** 根据 fitScale * zoom 与 pan 重新摆放画布 */
function layoutCanvas() {
  if (!canvasWrap || !canvasEl) return;
  viewScale = fitScale * zoom;
  const wrapW = canvasWrap.clientWidth || LOGICAL_W;
  const wrapH = canvasWrap.clientHeight || LOGICAL_H;
  const cw = LOGICAL_W * viewScale;
  const ch = LOGICAL_H * viewScale;
  canvasEl.style.width = cw + 'px';
  canvasEl.style.height = ch + 'px';
  canvasEl.style.left = Math.round((wrapW - cw) / 2 + panX) + 'px';
  canvasEl.style.top = Math.round((wrapH - ch) / 2 + panY) + 'px';
  const te = $('.text-edit');
  if (te && te.dataset.lx != null) {
    te.style.left = (canvasEl.offsetLeft + Number(te.dataset.lx) * viewScale) + 'px';
    te.style.top = (canvasEl.offsetTop + Number(te.dataset.ly) * viewScale) + 'px';
    te.style.fontSize = (Number(te.dataset.size) || 26) * viewScale + 'px';
    te.style.width = Math.max(120, (Number(te.dataset.size) || 26) * 4 * viewScale) + 'px';
  }
  renderCursorLayer();
}

/** 画布逻辑坐标 -> 相对画布容器的屏幕坐标 */
function logicalToScreen(p) {
  return { x: canvasEl.offsetLeft + p.x * viewScale, y: canvasEl.offsetTop + p.y * viewScale };
}

function updateZoomUI() {
  $('#zoomPct').textContent = Math.round(zoom * 100) + '%';
}

function resetZoom() {
  zoom = 1;
  panX = 0;
  panY = 0;
  layoutCanvas();
  updateZoomUI();
}

/** 以屏幕上某点为锚点缩放（滚轮 / 按钮） */
function zoomAt(clientX, clientY, factor) {
  const before = toLogical({ clientX, clientY });
  const newZoom = clamp(zoom * factor, 0.2, 4);
  if (newZoom === zoom) return;
  const wr = canvasWrap.getBoundingClientRect();
  const sx = clientX - wr.left;
  const sy = clientY - wr.top;
  zoom = newZoom;
  viewScale = fitScale * zoom;
  const cw = LOGICAL_W * viewScale;
  const ch = LOGICAL_H * viewScale;
  const wrapW = canvasWrap.clientWidth;
  const wrapH = canvasWrap.clientHeight;
  panX = sx - (wrapW - cw) / 2 - before.x * viewScale;
  panY = sy - (wrapH - ch) / 2 - before.y * viewScale;
  layoutCanvas();
  updateZoomUI();
}

function toLogical(e) {
  const r = canvasEl.getBoundingClientRect();
  return {
    x: clamp((e.clientX - r.left) / viewScale, 0, LOGICAL_W),
    y: clamp((e.clientY - r.top) / viewScale, 0, LOGICAL_H),
  };
}

function loop() {
  draw();
  renderCursorLayer();
  rafId = requestAnimationFrame(loop);
}

/** 元素层级值：无 z 时图片默认 0..n、标注默认 100000..（保持原有“图片在下”语义） */
function elementZ(el, images, annotations) {
  if (typeof el.z === 'number') return el.z;
  if (el.layer === 'image') return images.indexOf(el);
  return 100000 + annotations.indexOf(el);
}

/** 当前页所有元素按 z 排序后的渲染顺序 */
function renderOrder() {
  if (!roomData || !activePage) return [];
  const images = activePage.images;
  const annotations = activePage.annotations;
  return images.concat(annotations)
    .sort((a, b) => elementZ(a, images, annotations) - elementZ(b, images, annotations));
}

// ---------- 渲染 ----------
function ensureImage(el) {
  if (imgCache.has(el.id) || !el.src) return;
  const im = new Image();
  im.onload = () => { imgCache.set(el.id, im); };
  im.src = el.src;
}

function draw() {
  const ctx = ctx2d;
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
  // 纸张背景 + 点阵网格
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.fillStyle = '#e9e9e6';
  for (let x = 24; x < LOGICAL_W; x += 48) {
    for (let y = 24; y < LOGICAL_H; y += 48) {
      ctx.beginPath();
      ctx.arc(x, y, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (!roomData) return;

  for (const el of renderOrder()) {
    if (el.kind === 'image') {
      ensureImage(el);
      drawImageEl(ctx, el);
    } else {
      drawAnnotation(ctx, el);
    }
  }

  if (hoveredId && hoveredId !== selectedId) drawSelectionOutline(ctx, hoveredId, 'rgba(47,111,235,.4)');
  if (selectedId) drawSelectionOutline(ctx, selectedId, '#2f6feb');
  drawActionPreview(ctx);
}

function drawImageEl(ctx, im) {
  const img = imgCache.get(im.id);
  ctx.save();
  ctx.translate(im.x, im.y);
  ctx.rotate(im.rotation || 0);
  if (img) {
    ctx.drawImage(img, -im.width / 2, -im.height / 2, im.width, im.height);
  } else {
    ctx.strokeStyle = '#c9c9c6';
    ctx.strokeRect(-im.width / 2, -im.height / 2, im.width, im.height);
  }
  ctx.restore();
}

function drawAnnotation(ctx, a, withLock = true) {
  ctx.save();
  if (a.rotation) {
    // 标注元素同样支持旋转：围绕自身中心旋转后再绘制
    const c = elementCenter(a);
    ctx.translate(c.x, c.y);
    ctx.rotate(a.rotation);
    ctx.translate(-c.x, -c.y);
  }
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = a.color;
  ctx.fillStyle = a.color;
  ctx.lineWidth = a.width || 2;
  switch (a.kind) {
    case 'pen': {
      if (a.points.length < 2) break;
      ctx.beginPath();
      ctx.moveTo(a.points[0].x, a.points[0].y);
      for (let i = 1; i < a.points.length; i++) ctx.lineTo(a.points[i].x, a.points[i].y);
      ctx.stroke();
      break;
    }
    case 'line': {
      ctx.beginPath();
      ctx.moveTo(a.x1, a.y1);
      ctx.lineTo(a.x2, a.y2);
      ctx.stroke();
      break;
    }
    case 'arrow': {
      ctx.beginPath();
      ctx.moveTo(a.x1, a.y1);
      ctx.lineTo(a.x2, a.y2);
      ctx.stroke();
      const ang = Math.atan2(a.y2 - a.y1, a.x2 - a.x1);
      const len = 13 + (a.width || 2) * 2;
      ctx.beginPath();
      ctx.moveTo(a.x2, a.y2);
      ctx.lineTo(a.x2 - len * Math.cos(ang - 0.42), a.y2 - len * Math.sin(ang - 0.42));
      ctx.moveTo(a.x2, a.y2);
      ctx.lineTo(a.x2 - len * Math.cos(ang + 0.42), a.y2 - len * Math.sin(ang + 0.42));
      ctx.stroke();
      break;
    }
    case 'rect': {
      const x = Math.min(a.x1, a.x2), y = Math.min(a.y1, a.y2);
      const w = Math.abs(a.x2 - a.x1), h = Math.abs(a.y2 - a.y1);
      ctx.strokeRect(x, y, w, h);
      break;
    }
    case 'circle': {
      ctx.beginPath();
      ctx.arc(a.cx, a.cy, Math.max(1, a.r), 0, Math.PI * 2);
      ctx.stroke();
      break;
    }
    case 'text': {
      ctx.font = (a.fontSize || 26) + 'px "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';
      ctx.textBaseline = 'top';
      const lines = String(a.text || '').split('\n');
      lines.forEach((line, i) => ctx.fillText(line, a.x, a.y + i * (a.fontSize || 26) * 1.25));
      break;
    }
  }
  ctx.restore();
  if (withLock) drawLockBadge(ctx, a.id);
}

function drawLockBadge(ctx, id) {
  const lock = locks.get(id);
  if (!lock || lock.userId === me.id) return;
  const bb = bboxOf(id);
  ctx.save();
  ctx.font = '15px serif';
  ctx.textBaseline = 'bottom';
  ctx.fillText('🔒', bb.x, bb.y - 2);
  ctx.restore();
}

function textMetrics(el) {
  const fs = el.fontSize || 26;
  ctx2d.font = fs + 'px "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';
  const lines = String(el.text || '').split('\n');
  let w = 0;
  for (const line of lines) w = Math.max(w, ctx2d.measureText(line).width);
  return { w, h: lines.length * fs * 1.25 };
}

/** 元素未旋转时的包围盒（世界坐标） */
function bboxUnrotated(el) {
  if (el.kind === 'image') return { x: el.x - el.width / 2, y: el.y - el.height / 2, w: el.width, h: el.height };
  if (el.kind === 'circle') return { x: el.cx - el.r, y: el.cy - el.r, w: el.r * 2, h: el.r * 2 };
  if (el.kind === 'pen') {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const pt of el.points) {
      x1 = Math.min(x1, pt.x); y1 = Math.min(y1, pt.y);
      x2 = Math.max(x2, pt.x); y2 = Math.max(y2, pt.y);
    }
    return { x: x1, y: y1, w: Math.max(0, x2 - x1), h: Math.max(0, y2 - y1) };
  }
  if (el.kind === 'text') {
    const m = textMetrics(el);
    return { x: el.x, y: el.y, w: m.w, h: m.h };
  }
  return { x: Math.min(el.x1, el.x2), y: Math.min(el.y1, el.y2), w: Math.abs(el.x2 - el.x1), h: Math.abs(el.y2 - el.y1) };
}

/** 元素旋转中心（世界坐标） */
function elementCenter(el) {
  if (el.kind === 'image') return { x: el.x, y: el.y };
  if (el.kind === 'circle') return { x: el.cx, y: el.cy };
  const bb = bboxUnrotated(el);
  return { x: bb.x + bb.w / 2, y: bb.y + bb.h / 2 };
}

/** 旋转后的轴对齐包围盒（用于锁定标记等） */
function bboxOf(id) {
  const el = findElement(id);
  if (!el) return { x: 0, y: 0, w: 0, h: 0 };
  const bb = bboxUnrotated(el);
  if (!el.rotation) return bb;
  const c = elementCenter(el);
  const cos = Math.cos(el.rotation), sin = Math.sin(el.rotation);
  const xs = [], ys = [];
  for (const [px, py] of [[bb.x, bb.y], [bb.x + bb.w, bb.y], [bb.x, bb.y + bb.h], [bb.x + bb.w, bb.y + bb.h]]) {
    xs.push(c.x + (px - c.x) * cos - (py - c.y) * sin);
    ys.push(c.y + (px - c.x) * sin + (py - c.y) * cos);
  }
  const x1 = Math.min(...xs), y1 = Math.min(...ys);
  return { x: x1, y: y1, w: Math.max(...xs) - x1, h: Math.max(...ys) - y1 };
}

function drawSelectionOutline(ctx, id, color) {
  const el = findElement(id);
  if (!el) return;
  const c = elementCenter(el);
  let hw, hh;
  if (el.kind === 'image') { hw = el.width / 2; hh = el.height / 2; }
  else { const bb = bboxUnrotated(el); hw = bb.w / 2; hh = bb.h / 2; }
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(el.rotation || 0);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6 / Math.max(1, viewScale);
  ctx.setLineDash([6, 4]);
  ctx.strokeRect(-hw - 3, -hh - 3, hw * 2 + 6, hh * 2 + 6);
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(0, -hh - 4);
  ctx.lineTo(0, -hh - 26);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, -hh - 30, 9, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.stroke();
  ctx.font = '15px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2f6feb';
  ctx.fillText('↻', 0, -hh - 30);
  const hs = 7;
  ctx.fillStyle = '#fff';
  for (const [sx, sy] of [[1, 1], [-1, 1], [-1, -1], [1, -1]]) {
    ctx.fillRect(sx * hw - hs / 2, sy * hh - hs / 2, hs, hs);
    ctx.strokeRect(sx * hw - hs / 2, sy * hh - hs / 2, hs, hs);
  }
  ctx.restore();
}

function drawActionPreview(ctx) {
  if (!currentAction) return;
  if (currentAction.type === 'erase') {
    const last = currentAction.points[currentAction.points.length - 1];
    if (last) {
      ctx.save();
      ctx.strokeStyle = 'rgba(229,72,77,.75)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.arc(last.x, last.y, currentAction.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ---------- 命中测试 ----------
function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = clamp(t, 0, 1);
  const x = ax + t * dx, y = ay + t * dy;
  return Math.hypot(px - x, py - y);
}

function distToPolyline(p, pts) {
  let d = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    d = Math.min(d, distToSegment(p.x, p.y, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y));
  }
  return d;
}

function hitImage(p, im) {
  const dx = p.x - im.x, dy = p.y - im.y;
  const cos = Math.cos(-(im.rotation || 0)), sin = Math.sin(-(im.rotation || 0));
  const lx = dx * cos - dy * sin;
  const ly = dx * sin + dy * cos;
  if (Math.abs(lx) <= im.width / 2 + 6 && Math.abs(ly) <= im.height / 2 + 6) return true;
  return isNearRotateHandle(p, im); // 图片上方的旋转手柄也可点击
}

/** 判断点是否落在图片的旋转手柄区域（图片正上方） */
function isNearRotateHandle(p, el) {
  const l = toLocal(p, el);
  const hh = el.kind === 'image' ? el.height / 2 : bboxUnrotated(el).h / 2;
  return Math.abs(l.x) <= 15 && l.y <= -hh && l.y >= -hh - 44;
}

function hitAnnotation(p, a) {
  const l = toLocal(p, a);
  const c = elementCenter(a);
  const tol = Math.max(8, (a.width || 2) + 4);
  let hit = false;
  switch (a.kind) {
    case 'pen': {
      if (a.points.length < 2) return false;
      const pts = a.points.map((pt) => ({ x: pt.x - c.x, y: pt.y - c.y }));
      hit = distToPolyline(l, pts) <= tol;
      break;
    }
    case 'line':
    case 'arrow':
      hit = distToSegment(l.x, l.y, a.x1 - c.x, a.y1 - c.y, a.x2 - c.x, a.y2 - c.y) <= tol;
      break;
    case 'rect': {
      const x = Math.min(a.x1, a.x2) - c.x, y = Math.min(a.y1, a.y2) - c.y;
      const w = Math.abs(a.x2 - a.x1), h = Math.abs(a.y2 - a.y1);
      hit = l.x >= x - tol && l.x <= x + w + tol && l.y >= y - tol && l.y <= y + h + tol;
      break;
    }
    case 'circle':
      hit = Math.hypot(l.x, l.y) <= a.r + tol;
      break;
    case 'text': {
      const bb = bboxUnrotated(a);
      hit = l.x >= bb.x - c.x - 4 && l.x <= bb.x - c.x + bb.w + 4
        && l.y >= bb.y - c.y - 4 && l.y <= bb.y - c.y + bb.h + 4;
      break;
    }
  }
  if (hit) return true;
  return isNearRotateHandle(p, a); // 旋转手柄区域也可点选
}

function hitTest(p) {
  if (!roomData) return null;
  const list = renderOrder();
  for (let i = list.length - 1; i >= 0; i--) {
    const el = list[i];
    if (el.kind === 'image' ? hitImage(p, el) : hitAnnotation(p, el)) return el;
  }
  return null;
}

function toLocal(p, el) {
  const c = elementCenter(el);
  const dx = p.x - c.x, dy = p.y - c.y;
  const cos = Math.cos(-(el.rotation || 0)), sin = Math.sin(-(el.rotation || 0));
  return { x: dx * cos - dy * sin, y: dx * sin + dy * cos };
}

// ---------- 发送操作 ----------
function setSaveState(s) {
  const el = $('#saveState');
  el.textContent = s === 'saving' ? '保存中…' : '已保存';
  el.classList.toggle('saving', s === 'saving');
}

function sendOp(op, opts) {
  opts = opts || {};
  if (!currentRoomId || !roomData) return false;
  if (!canEdit) {
    toast('该房间为只读，您没有编辑权限', 'error');
    if (opts.onFail) opts.onFail();
    return false;
  }
  // 元素类操作自动携带当前页面 ID；页面管理操作自带 pageId
  if (!PAGE_OPS.has(op.type) && op.pageId == null && activePage) op.pageId = activePage.id;
  setSaveState('saving');
  socket.emit('op', { roomId: currentRoomId, op }, (res) => {
    if (!res || !res.ok) {
      setSaveState('saved');
      if (opts.onFail) opts.onFail();
      if (res && res.reason) toast(res.reason, 'error');
      return;
    }
    if (res.historyEntry) pushHistory(res.historyEntry);
    setSaveState('saved');
    idbPut(snapshotForIDB());
  });
  return true;
}

function sendTransient(op) {
  if (!currentRoomId || !canEdit) return;
  if (op.pageId == null && activePage) op.pageId = activePage.id;
  socket.emit('op', { roomId: currentRoomId, op: Object.assign({ transient: true }, op) });
}

// ---------- 服务端操作回放 ----------
const PAGE_OPS = new Set(['add-page', 'rename-page', 'delete-page']);

function replaceElement(list, el) {
  const i = list.findIndex((e) => e.id === el.id);
  if (i >= 0) list[i] = el;
  else list.push(el);
}

function applyPersistedOp(op) {
  if (!roomData) return;
  if (op.type === 'add-page') {
    if (!roomData.pages.some((p) => p.id === op.page.id)) {
      roomData.pages.push({
        id: op.page.id,
        name: op.page.name,
        images: op.page.images || [],
        annotations: op.page.annotations || [],
      });
      renderPageBar();
    }
    return;
  }
  if (op.type === 'rename-page') {
    const p = pageById(op.pageId);
    if (p) {
      p.name = op.name;
      renderPageBar();
    }
    return;
  }
  if (op.type === 'delete-page') {
    const idx = roomData.pages.findIndex((p) => p.id === op.pageId);
    if (idx >= 0) {
      roomData.pages.splice(idx, 1);
      if (activePageId === op.pageId) switchPage(roomData.pages[0].id, true);
      renderPageBar();
    }
    return;
  }
  const page = pageById(op.pageId);
  if (!page) return;
  if (!page.loaded) return; // 未加载页面的增量操作无需本地应用，切换时按需拉取全量
  const images = page.images;
  const annotations = page.annotations;
  switch (op.type) {
    case 'add-image':
      if (!images.some((e) => e.id === op.element.id)) {
        images.push(op.element);
        ensureImage(op.element);
      }
      break;
    case 'add-annotation':
      replaceElement(annotations, op.element);
      break;
    case 'update-annotation':
      replaceElement(annotations, op.element);
      break;
    case 'transform-image': {
      const im = images.find((e) => e.id === op.id);
      if (im) Object.assign(im, { x: op.x, y: op.y, rotation: op.rotation, width: op.width, height: op.height });
      break;
    }
    case 'erase': {
      const del = new Set(op.deletedIds || []);
      page.annotations = annotations.filter((e) => !del.has(e.id));
      for (const stroke of op.modifiedStrokes || []) replaceElement(page.annotations, stroke);
      break;
    }
    case 'delete-elements': {
      const del = new Set(op.ids || []);
      page.images = images.filter((e) => !del.has(e.id));
      page.annotations = annotations.filter((e) => !del.has(e.id));
      for (const id of del) { locks.delete(id); imgCache.delete(id); }
      if (selectedId && del.has(selectedId)) { selectedId = null; updateInspector(); }
      break;
    }
    case 'duplicate':
      for (const el of op.elements || []) {
        if (el.layer === 'image') {
          page.images.push(el);
          ensureImage(el);
        } else page.annotations.push(el);
      }
      break;
    case 'reorder': {
      const ids = new Set(op.ids || []);
      const images = page.images;
      const annotations = page.annotations;
      const targets = images.concat(annotations).filter((e) => ids.has(e.id));
      let min = Infinity, max = -Infinity;
      for (const e of images.concat(annotations)) {
        const z = elementZ(e, images, annotations);
        min = Math.min(min, z);
        max = Math.max(max, z);
      }
      const z = op.mode === 'back' ? min - 1 : max + 1;
      for (const e of targets) e.z = z;
      break;
    }
    case 'clear-annotations':
      page.annotations = [];
      if (selectedId && !findElement(selectedId)) { selectedId = null; updateInspector(); }
      break;
  }
}

function applyTransientOp(op) {
  if (!roomData) return;
  const page = pageById(op.pageId);
  if (!page) return;
  if (!page.loaded) return;
  switch (op.type) {
    case 'image-transform': {
      const im = page.images.find((e) => e.id === op.id);
      if (im) Object.assign(im, { x: op.x, y: op.y, rotation: op.rotation, width: op.width, height: op.height });
      break;
    }
    case 'stroke-progress':
    case 'shape-progress':
    case 'annotation-transform':
      replaceElement(page.annotations, op.element);
      break;
  }
}

socket.on('op', (msg) => {
  if (!roomData) return;
  if (msg.by && msg.by.userId === me.id) return; // 自己发送的操作已在本地应用
  if (msg.transient) { applyTransientOp(msg.op); return; }
  applyPersistedOp(msg.op);
  if (msg.historyEntry) pushHistory(msg.historyEntry);
  setSaveState('saved');
  idbPut(snapshotForIDB());
});

// ---------- 历史记录 ----------
function pushHistory(entry) {
  if (!roomData) return;
  roomData.history = roomData.history || [];
  roomData.history.push(entry);
  if (roomData.history.length > 1000) roomData.history.splice(0, roomData.history.length - 1000);
  renderTimeline();
}

function renderTimeline() {
  const tl = $('#timeline');
  if (!roomData || !roomData.history.length) {
    tl.innerHTML = '<div class="tl-empty">暂无操作记录<br>绘制、上传图片等操作会显示在这里</div>';
    return;
  }
  // 最新的记录显示在最上方
  tl.innerHTML = roomData.history.slice().reverse().map((h) =>
    '<div class="tl-item"><div class="tl-text">[' + esc(h.time) + '] ' + esc(h.text) + '</div></div>'
  ).join('');
  tl.scrollTop = 0;
}

// ---------- 成员与光标 ----------
function renderMembers() {
  const list = $('#memberList');
  $('#memberCount').textContent = members.length + ' 人在线';
  if (!members.length) {
    list.innerHTML = '<div class="tl-empty">暂无在线成员</div>';
    return;
  }
  list.innerHTML = members.map((m) => {
    const isMe = m.userId === me.id;
    const isAdminRow = roomData && roomData.createdBy === m.userId;
    const cur = m.cursor && m.cursor.x >= 0 ? '(' + Math.round(m.cursor.x) + ', ' + Math.round(m.cursor.y) + ')' : '';
    const pageName = m.pageId ? pageNameOf(m.pageId) : '';
    return '<div class="member-row">'
      + '<div class="avatar" style="background:' + esc(m.color) + '">' + esc(String(m.name).slice(0, 1)) + '</div>'
      + '<div class="nm">' + esc(m.name) + '</div>'
      + (isAdminRow ? '<span class="tag admin">创建者</span>' : '')
      + (isMe ? '<span class="tag me">我</span>' : '')
      + (pageName ? '<span class="tag page">' + esc(pageName) + '</span>' : '')
      + (cur ? '<span class="cursor-pos">' + cur + '</span>' : '')
      + '</div>';
  }).join('');
}

/** 根据页面 ID 取页名（未知时显示“另一页”） */
function pageNameOf(pageId) {
  if (!roomData || !roomData.pages) return '另一页';
  const p = roomData.pages.find((x) => x.id === pageId);
  return p ? p.name : '另一页';
}

function renderCursorLayer() {
  const layer = $('#cursorLayer');
  let html = '';
  for (const [userId, cur] of memberCursors) {
    if (userId === me.id || !cur || cur.x < 0) continue;
    const sp = logicalToScreen(cur);
    const samePage = !cur.pageId || cur.pageId === activePageId;
    const opacity = samePage ? '1' : '0.35';
    const pageLabel = samePage ? '' : ' · ' + pageNameOf(cur.pageId);
    html += '<div class="remote-cursor" style="left:' + sp.x + 'px;top:' + sp.y + 'px;opacity:' + opacity + '">'
      + '<span class="dot" style="background:' + esc(cur.color) + '"></span>'
      + '<span class="nm" style="background:' + esc(cur.color) + '">' + esc(cur.name) + pageLabel + '</span>'
      + '</div>';
  }
  layer.innerHTML = html;
}

// ---------- 交互 ----------
function bindCanvasEvents() {
  canvasWrap.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
  canvasEl.addEventListener('dblclick', (e) => {
    if (currentTool !== 'select' || !canEdit) return;
    const p = toLogical(e);
    if (!hitTest(p)) placeText(p);
  });
  canvasEl.addEventListener('mouseleave', () => {
    hoveredId = null;
    if (currentRoomId) socket.emit('cursor', { roomId: currentRoomId, x: -1, y: -1 });
  });
  // 滚轮缩放（以光标位置为锚点）
  canvasWrap.addEventListener('wheel', (e) => {
    if (e.target && e.target.closest && e.target.closest('.float-inspector')) return;
    hideElementMenu();
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0016);
    zoomAt(e.clientX, e.clientY, factor);
  }, { passive: false });
  // 右键查看元素信息
  canvasWrap.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const p = toLogical(e);
    const el = hitTest(p);
    if (!el) { hideElementMenu(); return; }
    showElementMenu(e.clientX, e.clientY, el);
  });
}

function onPointerDown(e) {
  if (!roomData) return;
  if (pageLoading) return; // 页面内容加载中，禁止操作避免覆盖数据
  hideElementMenu();
  const target = e.target;
  if (target && target.closest && (target.closest('.float-inspector') || target.closest('.text-edit'))) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  // 第二根手指落下：取消当前操作，进入双指缩放/平移
  if (activePointers.size === 2) {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    pressInfo = null;
    longPressActive = false;
    cancelCurrentAction();
    const pts = Array.from(activePointers.values());
    pinch = {
      dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1,
      zoom,
      mx: (pts[0].x + pts[1].x) / 2,
      my: (pts[0].y + pts[1].y) / 2,
      startLogical: toLogical({ clientX: (pts[0].x + pts[1].x) / 2, clientY: (pts[0].y + pts[1].y) / 2 }),
    };
    canvasWrap.setPointerCapture(e.pointerId);
    return;
  }
  const r = canvasEl.getBoundingClientRect();
  const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  // 中键或空格+左键：平移画布
  if (e.button === 1 || (spaceDown && e.button === 0)) {
    e.preventDefault();
    currentAction = { type: 'pan', startX: e.clientX, startY: e.clientY, panX, panY };
    canvasWrap.setPointerCapture(e.pointerId);
    return;
  }
  if (e.button !== 0 || !inside) return;
  if (e.pointerType === 'touch') canvasWrap.setPointerCapture(e.pointerId);
  const p = toLogical(e);
  if (currentTool === 'pen') startPen(p);
  else if (currentTool === 'eraser') startErase(p);
  else if (currentTool === 'line' || currentTool === 'rect' || currentTool === 'circle' || currentTool === 'arrow') startShape(p);
  else if (currentTool === 'text') {
    e.preventDefault(); // 阻止浏览器默认焦点转移（否则 PC 上输入框会立刻失焦）
    placeText(p);
  }
  else {
    const el = hitTest(p);
    if (el) {
      select(el.id);
      if (e.pointerType === 'touch') {
        // 移动端：先等待长按或拖动判定，避免误触发拖动
        pressInfo = { x: e.clientX, y: e.clientY, el };
        pressTimer = setTimeout(() => {
          pressTimer = null;
          const info = pressInfo;
          pressInfo = null;
          const cur = info && findElement(info.el.id);
          if (cur) {
            longPressActive = true;
            showElementMenu(info.x, info.y, cur);
            if (navigator.vibrate) navigator.vibrate(15);
          }
        }, 500);
      } else {
        startElementAction(p, el);
      }
    } else {
      selectedId = null;
      updateInspector();
    }
  }
}

function onPointerMove(e) {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }
  // 双指缩放/平移
  if (pinch && activePointers.size >= 2) {
    const pts = Array.from(activePointers.values());
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
    const mx = (pts[0].x + pts[1].x) / 2;
    const my = (pts[0].y + pts[1].y) / 2;
    const wr = canvasWrap.getBoundingClientRect();
    const sx = mx - wr.left;
    const sy = my - wr.top;
    zoom = clamp(pinch.zoom * (dist / pinch.dist), 0.2, 4);
    viewScale = fitScale * zoom;
    const cw = LOGICAL_W * viewScale;
    const ch = LOGICAL_H * viewScale;
    const wrapW = canvasWrap.clientWidth;
    const wrapH = canvasWrap.clientHeight;
    // 以手势起点中点的逻辑点为锚：手指移动 -> 画布跟随（平移）；距离变化 -> 缩放
    panX = sx - (wrapW - cw) / 2 - pinch.startLogical.x * viewScale;
    panY = sy - (wrapH - ch) / 2 - pinch.startLogical.y * viewScale;
    layoutCanvas();
    updateZoomUI();
    return;
  }
  const p = toLogical(e);
  // 移动端：手指移动超过阈值 -> 由“等待长按”转为拖动元素
  if (pressInfo) {
    if (Math.hypot(e.clientX - pressInfo.x, e.clientY - pressInfo.y) > 10) {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      const el = findElement(pressInfo.el.id);
      pressInfo = null;
      longPressActive = false;
      if (el && currentTool === 'select') startElementAction(p, el);
    }
  }
  if (currentRoomId && Date.now() - lastCursorSent > 40) {
    lastCursorSent = Date.now();
    socket.emit('cursor', { roomId: currentRoomId, x: Math.round(p.x), y: Math.round(p.y) });
  }

  if (!currentAction) {
    if (currentTool === 'select') {
      const el = hitTest(p);
      hoveredId = el ? el.id : null;
      const lock = el ? locks.get(el.id) : null;
      let cur = 'default';
      if (lock && lock.userId !== me.id) cur = 'not-allowed';
      else if (el && isNearRotateHandle(p, el)) cur = 'grab';
      else if (el) cur = 'move';
      canvasEl.style.cursor = cur;
    }
    return;
  }

  const act = currentAction;
  if (act.type === 'pan') {
    panX = act.panX + (e.clientX - act.startX);
    panY = act.panY + (e.clientY - act.startY);
    layoutCanvas();
    return;
  }
  if (act.type === 'move') {
    const el = findElement(act.id);
    if (!el) return;
    const dx = p.x - act.startX, dy = p.y - act.startY;
    if (Math.abs(dx) + Math.abs(dy) > 1) act.moved = true;
    if (el.kind === 'image') {
      el.x = act.snapshot.x + dx;
      el.y = act.snapshot.y + dy;
      sendTransient({ type: 'image-transform', id: el.id, x: el.x, y: el.y, rotation: el.rotation, width: el.width, height: el.height });
    } else {
      const s = act.snapshot;
      if (el.kind === 'pen') el.points = s.points.map((pt) => ({ x: pt.x + dx, y: pt.y + dy }));
      else if (el.kind === 'line' || el.kind === 'arrow' || el.kind === 'rect') {
        el.x1 = s.x1 + dx; el.y1 = s.y1 + dy; el.x2 = s.x2 + dx; el.y2 = s.y2 + dy;
      } else if (el.kind === 'circle') { el.cx = s.cx + dx; el.cy = s.cy + dy; }
      else if (el.kind === 'text') { el.x = s.x + dx; el.y = s.y + dy; }
      sendTransient({ type: 'annotation-transform', element: JSON.parse(JSON.stringify(el)) });
    }
  } else if (act.type === 'resize') {
    const el = findElement(act.id);
    if (!el) return;
    const l = toLocal(p, el);
    const sl = toLocal({ x: act.startX, y: act.startY }, el);
    const sx = act.corner[0], sy = act.corner[1];
    const startDist = Math.max(24, Math.hypot(sl.x, sl.y));
    const d = (sx * l.x + sy * l.y) - (sx * sl.x + sy * sl.y);
    const factor = clamp(1 + d / startDist, 0.15, 8);
    const tmp = JSON.parse(JSON.stringify(act.snapshot));
    scaleElement(tmp, factor);
    Object.assign(el, tmp);
    act.moved = true;
    if (el.kind === 'image') {
      sendTransient({ type: 'image-transform', id: el.id, x: el.x, y: el.y, rotation: el.rotation, width: el.width, height: el.height });
    } else {
      sendTransient({ type: 'annotation-transform', element: JSON.parse(JSON.stringify(el)) });
    }
  } else if (act.type === 'rotate') {
    const el = findElement(act.id);
    if (!el) return;
    // 以元素中心为基准直接算屏幕角度，避免旋转过程中坐标反馈漂移
    const cx = act.center.x, cy = act.center.y;
    const ang = Math.atan2(p.y - cy, p.x - cx);
    const startAng = Math.atan2(act.startY - cy, act.startX - cx);
    el.rotation = (act.snapshot.rotation || 0) + (ang - startAng);
    act.moved = true;
    if (el.kind === 'image') {
      sendTransient({ type: 'image-transform', id: el.id, x: el.x, y: el.y, rotation: el.rotation, width: el.width, height: el.height });
    } else {
      sendTransient({ type: 'annotation-transform', element: JSON.parse(JSON.stringify(el)) });
    }
  } else if (act.type === 'shape') {
    const el = act.element;
    if (el.kind === 'circle') {
      el.r = Math.hypot(p.x - el.cx, p.y - el.cy);
    } else {
      el.x2 = p.x; el.y2 = p.y;
    }
    if (Date.now() - act.lastSend > 40) {
      act.lastSend = Date.now();
      sendTransient({ type: 'shape-progress', element: JSON.parse(JSON.stringify(el)) });
    }
  } else if (act.type === 'pen') {
    const el = act.element;
    const last = el.points[el.points.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) > 1.5) el.points.push({ x: p.x, y: p.y });
    if (Date.now() - act.lastSend > 40) {
      act.lastSend = Date.now();
      sendTransient({ type: 'stroke-progress', element: JSON.parse(JSON.stringify(el)) });
    }
  } else if (act.type === 'erase') {
    const last = act.points[act.points.length - 1];
    if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 3) act.points.push({ x: p.x, y: p.y });
  }
}

function onPointerUp(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinch = null;
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  if (longPressActive) { longPressActive = false; pressInfo = null; return; }
  pressInfo = null;
  const act = currentAction;
  if (!act) return;
  if (act.type === 'pan') { currentAction = null; return; }
  const p = toLogical(e);
  if (act.id) releaseLock(act.id);

  if ((act.type === 'move' || act.type === 'resize' || act.type === 'rotate') && act.moved) {
    const el = findElement(act.id);
    if (el && el.kind === 'image') {
      sendOp({ type: 'transform-image', id: el.id, x: el.x, y: el.y, rotation: el.rotation || 0, width: el.width, height: el.height }, {
        onFail: () => { const t = findElement(act.id); if (t) Object.assign(t, act.snapshot); },
      });
    } else if (el) {
      sendOp({ type: 'update-annotation', element: JSON.parse(JSON.stringify(el)) }, {
        onFail: () => { const t = findElement(act.id); if (t) Object.assign(t, act.snapshot); },
      });
    }
  }
  if (act.type === 'shape') {
    const el = act.element;
    if (el.kind === 'rect') {
      const x1 = Math.min(el.x1, el.x2), y1 = Math.min(el.y1, el.y2);
      el.x1 = x1; el.y1 = y1; el.x2 = x1 + Math.abs(el.x2 - el.x1); el.y2 = y1 + Math.abs(el.y2 - el.y1);
    }
    const sizeOk = el.kind === 'circle' ? el.r > 3 : Math.hypot(el.x2 - el.x1, el.y2 - el.y1) > 3;
    if (sizeOk) {
      selectedId = el.id;
      sendOp({ type: 'add-annotation', element: el }, { onFail: () => { removeElementLocal(el.id); } });
    } else {
      removeElementLocal(el.id);
    }
    updateInspector();
  }
  if (act.type === 'pen') {
    const el = act.element;
    if (el.points.length >= 2) {
      selectedId = el.id;
      sendOp({ type: 'add-annotation', element: el }, { onFail: () => { removeElementLocal(el.id); } });
    } else {
      removeElementLocal(el.id);
    }
    updateInspector();
  }
  if (act.type === 'erase') {
    finishErase(act);
  }
  currentAction = null;
}

/** 取消当前绘制/拖拽（双指手势开始时调用） */
function cancelCurrentAction() {
  const act = currentAction;
  if (!act) return;
  if (act.type === 'shape' || act.type === 'pen') {
    if (act.element) removeElementLocal(act.element.id);
  } else if (act.id) {
    const el = findElement(act.id);
    if (el && act.snapshot) Object.assign(el, act.snapshot);
    releaseLock(act.id);
  }
  currentAction = null;
}

function removeElementLocal(id) {
  if (!roomData) return;
  roomData.images = roomData.images.filter((e) => e.id !== id);
  roomData.annotations = roomData.annotations.filter((e) => e.id !== id);
  if (selectedId === id) { selectedId = null; updateInspector(); }
}

function startElementAction(p, el) {
  if (!canEdit) return; // 只读模式下仅允许查看/选择
  const lock = locks.get(el.id);
  if (lock && lock.userId !== me.id) {
    toast(lock.userName + ' 正在编辑该元素', 'error');
    return;
  }
  const snapshot = JSON.parse(JSON.stringify(el));
  const act = { type: 'move', id: el.id, startX: p.x, startY: p.y, snapshot, moved: false, center: elementCenter(el) };
  currentAction = act;

  // 所有元素（图片与标注）统一支持：拖动移动、角点缩放、上方圆点旋转
  const local = toLocal(p, el);
  let hw, hh;
  if (el.kind === 'image') { hw = el.width / 2; hh = el.height / 2; }
  else { const bb = bboxUnrotated(el); hw = bb.w / 2; hh = bb.h / 2; }
  if (Math.hypot(local.x, local.y + hh + 30) < 14) {
    act.type = 'rotate';
    canvasEl.style.cursor = 'grab';
  } else {
    for (const [sx, sy] of [[1, 1], [-1, 1], [-1, -1], [1, -1]]) {
      if (Math.hypot(local.x - sx * hw, local.y - sy * hh) < 16) {
        act.type = 'resize';
        act.corner = [sx, sy];
        canvasEl.style.cursor = 'nwse-resize';
        break;
      }
    }
  }

  socket.emit('lock-element', { roomId: currentRoomId, elementId: el.id }, (res) => {
    if (res && res.ok) {
      locks.set(el.id, res.lock);
    } else {
      // 锁被他人抢先：回滚
      const target = findElement(el.id);
      if (target) Object.assign(target, snapshot);
      if (res && res.lock) toast(res.lock.userName + ' 正在编辑该元素，已取消操作', 'error');
      else if (res && res.reason) toast(res.reason, 'error');
      currentAction = null;
    }
  });
}

function releaseLock(id) {
  socket.emit('unlock-element', { roomId: currentRoomId, elementId: id });
  locks.delete(id);
}

function startPen(p) {
  if (!canEdit) { toast('只读模式，无法绘制', 'error'); return; }
  const el = {
    id: uid(), kind: 'pen', layer: 'annotation',
    color: toolColor, width: Number($('#strokeWidth').value),
    points: [{ x: p.x, y: p.y }], rotation: 0,
  };
  stampElement(el);
  roomData.annotations.push(el);
  currentAction = { type: 'pen', element: el, lastSend: 0 };
  canvasEl.style.cursor = 'crosshair';
}

function startShape(p) {
  if (!canEdit) { toast('只读模式，无法绘制', 'error'); return; }
  const width = Number($('#strokeWidth').value);
  const base = { id: uid(), kind: currentTool, layer: 'annotation', color: toolColor, width };
  base.rotation = 0;
  let el;
  if (currentTool === 'circle') el = Object.assign(base, { cx: p.x, cy: p.y, r: 0 });
  else el = Object.assign(base, { x1: p.x, y1: p.y, x2: p.x, y2: p.y });
  stampElement(el);
  roomData.annotations.push(el);
  currentAction = { type: 'shape', element: el, lastSend: 0 };
  canvasEl.style.cursor = 'crosshair';
}

function startErase(p) {
  if (!canEdit) { toast('只读模式，无法擦除', 'error'); return; }
  currentAction = { type: 'erase', points: [{ x: p.x, y: p.y }], radius: 16 };
  canvasEl.style.cursor = 'crosshair';
}

function nearEraser(pt, pathPts, radius) {
  const r = radius;
  const pts = pathPts;
  for (let i = 0; i < pts.length - 1; i++) {
    if (distToSegment(pt.x, pt.y, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y) <= r) return true;
  }
  return pts.length === 1 && Math.hypot(pt.x - pts[0].x, pt.y - pts[0].y) <= r;
}

function eraseAffects(a, act) {
  const r = act.radius;
  const c = elementCenter(a);
  for (const pt of act.points) {
    const l = toLocal(pt, a); // 把橡皮擦轨迹变换到元素局部坐标系（含旋转）
    if (a.kind === 'line' || a.kind === 'arrow') {
      if (distToSegment(l.x, l.y, a.x1 - c.x, a.y1 - c.y, a.x2 - c.x, a.y2 - c.y) <= r + (a.width || 2) / 2) return true;
    } else if (a.kind === 'rect') {
      const x = Math.min(a.x1, a.x2) - c.x, y = Math.min(a.y1, a.y2) - c.y;
      const w = Math.abs(a.x2 - a.x1), h = Math.abs(a.y2 - a.y1);
      const bb = { x: x - r, y: y - r, w: w + r * 2, h: h + r * 2 };
      if (l.x >= bb.x && l.x <= bb.x + bb.w && l.y >= bb.y && l.y <= bb.y + bb.h) return true;
    } else if (a.kind === 'circle') {
      if (Math.hypot(l.x, l.y) <= a.r + r) return true;
    } else if (a.kind === 'text') {
      const bb = bboxUnrotated(a);
      const bx = bb.x - c.x, by = bb.y - c.y;
      if (l.x >= bx - r && l.x <= bx + bb.w + r && l.y >= by - r && l.y <= by + bb.h + r) return true;
    }
  }
  return false;
}

function finishErase(act) {
  if (!roomData) return;
  const deletedIds = [];
  const modifiedStrokes = [];
  for (const a of roomData.annotations) {
    if (a.kind === 'pen') {
      const ePts = act.points.map((ep) => toLocal(ep, a));
      const kept = a.points.filter((pt) => !nearEraser(toLocal(pt, a), ePts, act.radius));
      if (kept.length < 2) deletedIds.push(a.id);
      else if (kept.length !== a.points.length) modifiedStrokes.push(Object.assign({}, a, { points: kept }));
    } else if (eraseAffects(a, act)) {
      deletedIds.push(a.id);
    }
  }
  if (deletedIds.length || modifiedStrokes.length) {
    const delSet = new Set(deletedIds);
    roomData.annotations = roomData.annotations.filter((e) => !delSet.has(e.id));
    for (const s of modifiedStrokes) replaceElement(roomData.annotations, s);
    if (selectedId && delSet.has(selectedId)) { selectedId = null; updateInspector(); }
    sendOp({ type: 'erase', deletedIds, modifiedStrokes });
  }
}

function placeText(p) {
  if (!canEdit) { toast('只读模式，无法添加文字', 'error'); return; }
  if ($('.text-edit')) return;
  const fontSize = Number($('#fontSize').value);
  const el = document.createElement('textarea');
  el.className = 'text-edit';
  const sp = logicalToScreen(p);
  el.style.left = sp.x + 'px';
  el.style.top = sp.y + 'px';
  el.style.fontSize = (fontSize * viewScale) + 'px';
  el.dataset.size = fontSize;
  el.dataset.lx = p.x;
  el.dataset.ly = p.y;
  el.style.width = Math.max(120, fontSize * 4 * viewScale) + 'px';
  el.rows = 1;
  canvasWrap.appendChild(el);
  // 延迟聚焦：等浏览器当前事件的默认动作（mousedown 焦点转移）结束后再聚焦
  setTimeout(() => { if (document.body.contains(el)) el.focus(); }, 0);
  let committed = false;
  const commit = () => {
    if (committed) return;
    committed = true;
    const text = el.value;
    el.remove();
    if (text.trim()) {
      const a = { id: uid(), kind: 'text', layer: 'annotation', color: toolColor, x: p.x, y: p.y, fontSize, text, rotation: 0 };
      stampElement(a);
      roomData.annotations.push(a);
      selectedId = a.id;
      sendOp({ type: 'add-annotation', element: a }, { onFail: () => removeElementLocal(a.id) });
      updateInspector();
    }
  };
  el.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commit(); }
    if (ev.key === 'Escape') { ev.preventDefault(); committed = true; el.remove(); }
  });
  el.addEventListener('blur', commit);
}

// ---------- 选择与元素操作 ----------
function select(id) {
  selectedId = id;
  updateInspector();
}

function updateInspector() {
  const insp = $('#floatInspector');
  if (!selectedId || !findElement(selectedId)) {
    insp.classList.add('hidden');
    return;
  }
  insp.classList.remove('hidden');
  const sel = findElement(selectedId);
  $('#inspRotHint').classList.toggle('hidden', !sel);
